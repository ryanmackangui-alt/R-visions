<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision SQL</title>
<meta name="description" content="Application de révision SQL (R5.04) : cours illustré, labo SQL interactif, exercices corrigés automatiquement, quiz, flashcards et examen blanc.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0;--surface:#ffffff;--surface2:#efede7;--ink:#1c1a17;--muted:#6a655c;--line:#e0dcd2;
  --acc:#7b1f79;--acc-soft:#f4e6f3;--acc2:#0e8fa3;--acc2-soft:#e2f4f6;
  --ok:#1d7f46;--ok-soft:#e3f3e8;--bad:#bf3228;--bad-soft:#fbe7e4;--warn:#a86a12;--warn-soft:#fbf0dc;
  --code-bg:#1e1d24;--code-ink:#e8e6f0;--kw:#ff9ad5;--str:#9be2a0;--num:#ffcf7a;--fn:#8fd3ff;--com:#8b879a;
  --nullc:#b1aca2;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --r:14px;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141317;--surface:#1d1c21;--surface2:#26252c;--ink:#ecebe7;--muted:#a19d95;--line:#34323a;
    --acc:#e08fdd;--acc-soft:#3a2439;--acc2:#4ccadd;--acc2-soft:#193338;
    --ok:#5cc98a;--ok-soft:#1b3326;--bad:#f07a70;--bad-soft:#3b2120;--warn:#e6b25a;--warn-soft:#382d18;
    --code-bg:#111015;--nullc:#6d6873;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#141317;--surface:#1d1c21;--surface2:#26252c;--ink:#ecebe7;--muted:#a19d95;--line:#34323a;
  --acc:#e08fdd;--acc-soft:#3a2439;--acc2:#4ccadd;--acc2-soft:#193338;
  --ok:#5cc98a;--ok-soft:#1b3326;--bad:#f07a70;--bad-soft:#3b2120;--warn:#e6b25a;--warn-soft:#382d18;
  --code-bg:#111015;--nullc:#6d6873;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
button,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:750;letter-spacing:-.01em}
h3{font-size:1.12rem;font-weight:700;margin-top:1.6em}
h4{margin:1.2em 0 .4em}
p{margin:.45em 0 .8em}
ul,ol{margin:.3em 0 .9em;padding-left:1.25em}
li{margin:.25em 0}
b,strong{font-weight:650}
.muted{color:var(--muted)}
.small{font-size:.86rem}
code,pre,textarea,table.dt,kbd{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
code{font-family:var(--mono);font-size:.86em;background:var(--surface2);padding:1px 5px;border-radius:5px}

header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;text-decoration:none;color:var(--ink);white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
nav.tabs a:hover{background:var(--surface2);color:var(--ink)}
nav.tabs a.on{background:var(--acc);color:#fff}
:root[data-theme="dark"] nav.tabs a.on,:root[data-theme="dark"] .btn.pri{color:#1a0f1a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs a.on,:root:not([data-theme="light"]) .btn.pri{color:#1a0f1a}}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
@media (max-width:720px){.brand span{display:none}}

main{max-width:1180px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid>*,.course>*,.hero>*,.exo>*{min-width:0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:650;background:var(--surface2);color:var(--muted)}
.pill.acc{background:var(--acc-soft);color:var(--acc)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
kbd{font:600 .78rem var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--surface2)}

/* code */
pre.code{background:var(--code-bg);color:var(--code-ink);font:13.5px/1.55 var(--mono);padding:14px 16px;border-radius:12px;overflow-x:auto;margin:12px 0;position:relative;white-space:pre}
pre.code .k{color:var(--kw);font-weight:600}.code .s{color:var(--str)}.code .n{color:var(--num)}.code .f{color:var(--fn)}.code .c{color:var(--com);font-style:italic}
.codewrap{position:relative}
.codewrap .try{position:absolute;top:8px;right:8px;font:600 .75rem Inter,sans-serif;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:4px 9px;cursor:pointer}
.codewrap .try:hover{background:rgba(255,255,255,.22)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .card:first-child{background:linear-gradient(135deg,var(--acc-soft),var(--surface) 70%)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .v{font-size:1.6rem;font-weight:800}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);font-weight:800}
.steps li.done::before{content:"✓";background:var(--ok-soft);color:var(--ok)}

/* course */
.course{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:74px;display:flex;flex-direction:column;gap:4px}
.side a{display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:550;font-size:.93rem;border:1px solid transparent}
.side a:hover{background:var(--surface)}
.side a.on{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow);color:var(--acc)}
.side a .ck{margin-left:auto;color:var(--ok);font-weight:800}
.side .num{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface2);font-size:.78rem;font-weight:750;flex:none}
@media (max-width:900px){
  .course{grid-template-columns:minmax(0,1fr)}
  .side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .side a{white-space:nowrap;background:var(--surface);border-color:var(--line)}
}
.lesson h3{color:var(--acc)}
.box{border-radius:12px;padding:12px 16px;margin:14px 0;border:1px solid}
.box>:first-child{margin-top:0}.box>:last-child{margin-bottom:0}
.box .bt{font-weight:750;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px}
.key{background:var(--acc2-soft);border-color:color-mix(in srgb,var(--acc2) 35%,transparent)}.key .bt{color:var(--acc2)}
.trap{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}.trap .bt{color:var(--bad)}
.tip{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}.tip .bt{color:var(--warn)}
.memo-tag{display:inline-block;font-size:.72rem;font-weight:700;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:99px;vertical-align:middle;margin-left:6px}
figure{margin:16px 0;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
figure svg{display:block;margin:0 auto;max-width:100%;height:auto}
figcaption{font-size:.84rem;color:var(--muted);margin-top:8px;text-align:center}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.92rem;margin:12px 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.readbtn.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

/* data tables */
table.dt{border-collapse:collapse;font:13px/1.4 var(--mono);background:var(--surface)}
table.dt th{background:var(--surface2);font-weight:700;text-align:left;padding:6px 10px;border:1px solid var(--line);white-space:nowrap}
table.dt td{padding:5px 10px;border:1px solid var(--line);white-space:nowrap}
table.dt td.null{color:var(--nullc);font-style:italic}
table.dt tr.off td{opacity:.35;text-decoration:line-through}
table.dt tr.hit td{background:var(--ok-soft)}
table.dt tr.miss td{background:var(--warn-soft)}
table.dt caption{caption-side:top;text-align:left;font:700 .82rem Inter,sans-serif;padding:0 0 6px;color:var(--acc)}
.dtwrap{overflow:auto;max-height:420px;border-radius:10px}
.vis{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin:12px 0}
.vis .arrow{font-size:1.6rem;color:var(--muted);align-self:center}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.seg button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.88rem}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.explain{padding:10px 14px;border-radius:10px;background:var(--surface2);font-size:.93rem}
.hl-line{background:rgba(255,154,213,.18);display:inline-block;width:100%;border-left:3px solid var(--kw);margin-left:-16px;padding-left:13px}

/* labo */
.lab{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.lab{grid-template-columns:minmax(0,1fr)}}
.schema{display:flex;flex-direction:column;gap:8px;font-size:.86rem}
.schema details{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 10px}
.schema summary{cursor:pointer;font-weight:700;color:var(--acc)}
.schema .col{font-family:var(--mono);font-size:.8rem;padding:1px 0;cursor:pointer}
.schema .col:hover{color:var(--acc)}
.schema .pk{text-decoration:underline;font-weight:700}
.schema .fk{font-style:italic}
textarea.ed{width:100%;min-height:150px;resize:vertical;background:var(--code-bg);color:var(--code-ink);font:14px/1.55 var(--mono);border:1px solid var(--line);border-radius:12px;padding:14px;outline:none;tab-size:2}
textarea.ed:focus{border-color:var(--acc)}
.res{margin-top:12px}
.err{padding:10px 14px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font:13px/1.5 var(--mono);white-space:pre-wrap}
.okmsg{padding:10px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.engine{font-size:.8rem}

/* exercises */
.exo{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.exo{grid-template-columns:minmax(0,1fr)}}
.exlist{display:flex;flex-direction:column;gap:3px;max-height:calc(100vh - 110px);overflow:auto;position:sticky;top:74px}
@media (max-width:900px){.exlist{position:static;max-height:260px}}
.exlist .grp{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:10px 4px 2px}
.exlist a{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:.88rem}
.exlist a:hover{background:var(--surface)}
.exlist a.on{background:var(--surface);box-shadow:var(--shadow);color:var(--acc);font-weight:650}
.exlist .st{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.7rem}
.exlist .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.lvl{font-size:.75rem;color:var(--warn)}

/* quiz */
.qwrap{max-width:820px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qtxt{font-size:1.12rem;font-weight:650;margin:6px 0 14px}
.opts{display:grid;gap:9px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .l{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:750;font-size:.85rem}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}.opt.good .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .l{background:var(--bad);color:#fff}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 16px;border-radius:12px;background:var(--surface2);border-left:4px solid var(--acc2)}
.score{font-size:3rem;font-weight:800;color:var(--acc);line-height:1}
.review{display:grid;gap:10px;margin-top:16px}
.review .it{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.review .it.ko{border-left:4px solid var(--bad)}.review .it.okk{border-left:4px solid var(--ok)}
.timer{font:700 1.05rem var(--mono);padding:4px 10px;border-radius:8px;background:var(--surface2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.dots button{width:30px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.75rem;font-weight:650}
.dots button.ans{background:var(--acc-soft);border-color:var(--acc)}
.dots button.cur{outline:2px solid var(--acc);outline-offset:1px}

/* flashcards */
.fc-wrap{max-width:640px;margin:0 auto}
.fc{perspective:1400px;height:330px;cursor:pointer;margin:14px 0}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;overflow:auto}
.fc-b{transform:rotateY(180deg);background:linear-gradient(160deg,var(--acc-soft),var(--surface) 65%)}
.fc-f .q{font-size:1.25rem;font-weight:700}
.fc-b .a{font-size:1rem;color:var(--ink)}
.fc .hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.fc pre.code{text-align:left;font-size:12.5px;max-width:100%}

/* traps */
.traps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.trapc{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.trapc .f{padding:10px 14px;background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:.92rem}
.trapc .f::before{content:"✗ ";font-weight:800}
.trapc .v{padding:10px 14px;font-size:.93rem}
.trapc .v::before{content:"✓ ";color:var(--ok);font-weight:800}
.trapc pre.code{margin:0 14px 12px;font-size:12.5px}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
svg.dg text{font-family:Inter,system-ui,sans-serif;fill:var(--ink)}
@media (max-width:560px){main{padding:16px 16px 70px}.card{padding:16px}.fc{height:380px}}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <a class="brand" href="#home" aria-label="Accueil">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" fill="var(--acc)"/><ellipse cx="15" cy="9.5" rx="7" ry="2.6" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M8 9.5v11c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-11M8 15c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6" fill="none" stroke="#fff" stroke-width="1.8"/></svg>
      <span>SQL · Révision</span>
    </a>
    <nav class="tabs" id="tabs">
      <a href="#home" data-v="home">Accueil</a>
      <a href="#cours" data-v="cours">Cours</a>
      <a href="#labo" data-v="labo">Labo SQL</a>
      <a href="#exos" data-v="exos">Exercices</a>
      <a href="#quiz" data-v="quiz">Quiz</a>
      <a href="#cartes" data-v="cartes">Flashcards</a>
      <a href="#pieges" data-v="pieges">Pièges</a>
      <a href="#examen" data-v="examen">Examen blanc</a>
    </nav>
    <button class="iconbtn" id="themeBtn" title="Changer de thème" aria-label="Changer de thème">◐</button>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js"></script>
<script>
"use strict";
/* =========================================================
   Utilitaires
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('sqlrev_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sqlrev_' + k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem('sqlrev_' + k); } catch (e) { } }
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1800); }

/* Coloration syntaxique SQL */
const KW = new Set(('SELECT FROM WHERE GROUP BY HAVING ORDER LIMIT OFFSET DISTINCT AS AND OR NOT IN IS NULL LIKE BETWEEN JOIN INNER LEFT RIGHT FULL OUTER CROSS NATURAL ON USING UNION ALL INTERSECT EXCEPT MINUS EXISTS ANY ' +
  'CREATE TABLE VIEW DROP ALTER ADD MODIFY COLUMN INSERT INTO VALUES UPDATE SET DELETE TRUNCATE PRIMARY KEY FOREIGN REFERENCES UNIQUE CHECK CONSTRAINT DEFAULT ' +
  'GRANT REVOKE TO WITH OPTION COMMIT ROLLBACK BEGIN TRANSACTION CASE WHEN THEN ELSE END ASC DESC IF RENAME CASCADE PUBLIC ' +
  'INTEGER REAL TEXT BLOB VARCHAR CHAR DATE TIME TIMESTAMP NUMBER SMALLINT FLOAT AUTOINCREMENT').split(' '));
const FN = new Set('COUNT SUM AVG MIN MAX UPPER LOWER ROUND LENGTH SUBSTR COALESCE'.split(' '));
function hl(sql) {
  const re = /('(?:[^']|'')*')|(--[^\n]*)|(\b\d+(?:\.\d+)?\b)|([A-Za-zÀ-ÿ_][A-Za-zÀ-ÿ_0-9]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(sql))) {
    out += esc(sql.slice(last, m.index));
    if (m[1]) out += `<span class="s">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="c">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="n">${m[3]}</span>`;
    else { const u = m[4].toUpperCase(); out += KW.has(u) ? `<span class="k">${esc(m[4])}</span>` : FN.has(u) ? `<span class="f">${esc(m[4])}</span>` : esc(m[4]); }
    last = re.lastIndex;
  }
  return out + esc(sql.slice(last));
}
let codeId = 0;
const TRY = {};
/* bloc de code ; try=true ajoute un bouton « Essayer dans le labo » */
function code(sql, tryIt) {
  sql = sql.replace(/^\n+|\s+$/g, '');
  if (!tryIt) return `<pre class="code">${hl(sql)}</pre>`;
  const id = 'c' + (++codeId); TRY[id] = sql;
  return `<div class="codewrap"><pre class="code">${hl(sql)}</pre><button class="try" data-try="${id}">▶ Essayer</button></div>`;
}

function lastResult(db, sql) {

function friendlyError(msg, sql = '') {
  let tip = '';
  if (/near "(ALL|ANY)"/i.test(msg) || /[=<>]\s*(ANY|ALL)\s*\(/i.test(sql)) tip = '\nSQLite ne connaît pas ANY / ALL : remplace « > ALL (SELECT x …) » par « > (SELECT MAX(x) …) » et « > ANY » par « > (SELECT MIN(x) …) ».';
  if (/near "MINUS"/i.test(msg) || /\bMINUS\b/i.test(sql)) tip = '\nMINUS est la syntaxe Oracle : en SQLite (et en SQL standard) on écrit EXCEPT.';
  if (/no such column/i.test(msg)) tip = '\nVérifie l’orthographe de la colonne (sans accent ici : Designation, Quantite_Stock…) et préfixe-la par sa table si elle existe dans deux tables.';
  if (/ambiguous column/i.test(msg)) tip = '\nCette colonne existe dans plusieurs tables de ta jointure : écris Table.Colonne.';
  if (/no such table/i.test(msg)) tip = '\nTables disponibles : ' + SCHEMA.map(t => t[0]).join(', ') + '.';
  if (/misuse of aggregate/i.test(msg)) tip = '\nUne fonction d’agrégat (SUM, COUNT…) ne peut pas aller dans le WHERE : utilise HAVING après GROUP BY.';
  if (/MODIFY/i.test(msg)) tip = '\nSQLite ne gère pas ALTER TABLE … MODIFY (syntaxe Oracle/MySQL du mémo) : ADD COLUMN, RENAME et DROP COLUMN fonctionnent.';
  return msg + tip;
}
function resultTable(r, max = 200) {
  if (!r) return '<div class="okmsg">Requête exécutée (aucun résultat à afficher).</div>';
  const rows = r.values.slice(0, max);
  return `<div class="muted small" style="margin-bottom:6px">${r.values.length} ligne${r.values.length > 1 ? 's' : ''} · ${r.columns.length} colonne${r.columns.length > 1 ? 's' : ''}</div>
<div class="dtwrap"><table class="dt"><thead><tr>${r.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(v => v === null ? '<td class="null">NULL</td>' : `<td>${esc(typeof v === 'number' && !Number.isInteger(v) ? +v.toFixed(4) : v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${r.values.length > max ? `<div class="muted small">… ${r.values.length - max} lignes non affichées</div>` : ''}`;
}
const normCell = v => v === null || v === undefined ? '∅' : typeof v === 'number' ? (Math.round(v * 100) / 100).toString() : String(v).trim();
function sameResult(a, b, ordered) {
  if (!a || !b) return { ok: !a && !b, why: 'Ta requête ne renvoie aucun résultat.' };
  if (a.columns.length !== b.columns.length) return { ok: false, why: `Nombre de colonnes : ${a.columns.length} au lieu de ${b.columns.length} attendue${b.columns.length > 1 ? 's' : ''}.` };
  if (a.values.length !== b.values.length) return { ok: false, why: `Nombre de lignes : ${a.values.length} au lieu de ${b.values.length} attendue${b.values.length > 1 ? 's' : ''}.` };
  const ra = a.values.map(r => r.map(normCell).join('\u0001')), rb = b.values.map(r => r.map(normCell).join('\u0001'));
  if (ordered) {
    const same = ra.every((x, i) => x === rb[i]);
    if (same) return { ok: true };
    const sa = ra.slice().sort().join('\n') === rb.slice().sort().join('\n');
    return { ok: false, why: sa ? 'Les bonnes lignes sont là, mais pas dans le bon ordre (ORDER BY ?).' : 'Le contenu des lignes diffère du résultat attendu.' };
  }
  return ra.slice().sort().join('\n') === rb.slice().sort().join('\n') ? { ok: true } : { ok: false, why: 'Le contenu des lignes diffère du résultat attendu (même nombre de lignes et de colonnes).' };
}
/* vérifie un exercice ; renvoie {ok, why, user, expected} */
function checkExercise(ex, userSql) {
  const dbU = freshDb(), dbS = freshDb();
  try {
    let u, s;
    if (ex.check) {
      dbU.exec(userSql); dbS.exec(ex.sol);
      u = lastResult(dbU, ex.check); s = lastResult(dbS, ex.check);
    } else { u = lastResult(dbU, userSql); s = lastResult(dbS, ex.sol); }
    const c = sameResult(u, s, ex.ordered);
    return Object.assign(c, { user: u, expected: s });
  } catch (e) { return { ok: false, err: friendlyError(e.message, userSql) }; }
  finally { dbU.close(); dbS.close(); }
}

function mld() {
  const B = { Client: [20, 30], Commande: [250, 30], Livraison: [480, 30], Detail_Commande: [250, 210], Sortie_Stock: [480, 210], Produit: [365, 330] };
  const W = 165, rowH = 18;
  const pos = {};
  let s = '';
  SCHEMA.slice(0, 6).forEach(([name, cols]) => {
    const [x, y] = B[name], h = 28 + cols.length * rowH;
    pos[name] = { x, y, w: W, h, cx: x + W / 2, cy: y + h / 2 };
  });
  const link = (a, b, side) => {
    const A = pos[a], Bb = pos[b];
    let p;
    if (side === 'h') p = `M${A.x + A.w} ${A.y + 40} H${Bb.x}`;
    if (side === 'v') p = `M${A.cx} ${A.y + A.h} V${Bb.y}`;
    if (side === 'vb') p = `M${A.cx} ${A.y + A.h} V${Bb.y + 30} H${Bb.x}`;
    if (side === 'vc') p = `M${A.cx} ${A.y + A.h} V${Bb.y + 30} H${Bb.x + Bb.w}`;
    return `<path d="${p}" fill="none" stroke="var(--acc2)" stroke-width="1.6"/>`;
  };
  s += link('Client', 'Commande', 'h') + link('Commande', 'Livraison', 'h') + link('Commande', 'Detail_Commande', 'v') + link('Livraison', 'Sortie_Stock', 'v') + link('Detail_Commande', 'Produit', 'vb') + link('Sortie_Stock', 'Produit', 'vc');
  SCHEMA.slice(0, 6).forEach(([name, cols]) => {
    const { x, y, w, h } = pos[name];
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="var(--surface)" stroke="var(--acc2)" stroke-width="1.6"/><rect x="${x}" y="${y}" width="${w}" height="24" rx="8" fill="var(--acc2-soft)"/><text x="${x + w / 2}" y="${y + 16}" text-anchor="middle" font-size="12" font-weight="700">${name.toUpperCase().replace('_', ' ')}</text>`;
    cols.forEach(([c, k], i) => {
      const ty = y + 42 + i * rowH, isPk = k && k.includes('pk'), isFk = k && k.includes('fk');
      s += `<text x="${x + 10}" y="${ty}" font-size="11.5" ${isPk ? 'text-decoration="underline" font-weight="650"' : ''} ${isFk ? 'font-style="italic"' : ''}>${isFk ? '#' : ''}${c}</text>`;
    });
  });
  s += `<text x="20" y="470" font-size="11" fill="var(--muted)">Souligné = clé primaire · # en italique = clé étrangère</text>`;
  return `<svg class="dg" viewBox="0 0 660 480" width="660" height="480" role="img" aria-label="Modèle logique des données">${s}</svg>`;
}

const MINI_CLIENT = [['A', 'Adresse de A'], ['B', 'Adresse de B'], ['C', 'Adresse de C']];
const MINI_CMD = [[1, 'A'], [2, 'B'], [3, 'B'], [4, 'D']];
const JOINS = {
  cross: { lab: 'CROSS JOIN', sql: `SELECT Adresse, N_Commande\nFROM Client CROSS JOIN Commande;\n-- équivalent : FROM Client, Commande`, txt: 'Produit cartésien : chaque client est associé à CHAQUE commande. 3 × 4 = 12 lignes. Attention aux temps de calcul !' },
  inner: { lab: 'INNER JOIN', sql: `SELECT Adresse, N_Commande\nFROM Client INNER JOIN Commande\n  ON Client.Code_Client = Commande.Code_Client;`, txt: 'Seules les lignes qui ont une correspondance des deux côtés. C (aucune commande) et la commande 4 (client D inconnu) disparaissent.' },
  left: { lab: 'LEFT JOIN', sql: `SELECT Adresse, N_Commande\nFROM Client LEFT JOIN Commande\n  ON Client.Code_Client = Commande.Code_Client;`, txt: 'La table de GAUCHE (Client) est complète. C n’a pas de commande : ses colonnes côté Commande valent NULL.' },
  right: { lab: 'RIGHT JOIN', sql: `SELECT Adresse, N_Commande\nFROM Client RIGHT JOIN Commande\n  ON Client.Code_Client = Commande.Code_Client;`, txt: 'Symétrique du LEFT : la table de DROITE (Commande) est complète. La commande 4 (client D) apparaît avec une adresse NULL.' },
  full: { lab: 'FULL JOIN', sql: `SELECT Adresse, N_Commande\nFROM Client FULL JOIN Commande\n  ON Client.Code_Client = Commande.Code_Client;`, txt: 'Les DEUX tables complètes : C sans commande ET la commande 4 sans client. 5 lignes.' },
  neg: { lab: 'LEFT JOIN … IS NULL', sql: `SELECT Adresse, N_Commande\nFROM Client LEFT JOIN Commande\n  ON Client.Code_Client = Commande.Code_Client\nWHERE Commande.Code_Client IS NULL;`, txt: '« Négation » : on garde uniquement les lignes où la partie droite est NULL → les clients SANS commande. Équivalent à NOT IN (SELECT Code_Client FROM Commande).' }
};
function joinRows(type) {
  const rows = [], usedC = new Set(), usedK = new Set();
  if (type === 'cross') { MINI_CLIENT.forEach(c => MINI_CMD.forEach(k => rows.push([c[1], k[0]]))); return { rows, usedC: new Set([0, 1, 2]), usedK: new Set([0, 1, 2, 3]) }; }
  MINI_CLIENT.forEach((c, i) => MINI_CMD.forEach((k, j) => { if (c[0] === k[1]) { rows.push([c[1], k[0]]); usedC.add(i); usedK.add(j); } }));
  if (type === 'left' || type === 'full' || type === 'neg') MINI_CLIENT.forEach((c, i) => { if (!usedC.has(i)) rows.push([c[1], null]); });
  if (type === 'right' || type === 'full') MINI_CMD.forEach((k, j) => { if (!usedK.has(j)) rows.push([null, k[0]]); });
  if (type === 'neg') return { rows: rows.filter(r => r[1] === null), usedC: new Set([...MINI_CLIENT.keys()].filter(i => !usedC.has(i))), usedK: new Set() };
  return { rows, usedC, usedK };
}

}

function setResult(op) {
  const A = [...new Set(V_EL)], B = [...new Set(V_PR)];
  if (op === 'union') return [...new Set([...V_EL, ...V_PR])].sort();
  if (op === 'unionall') return [...V_EL, ...V_PR];
  if (op === 'intersect') return A.filter(x => B.includes(x)).sort();
  return A.filter(x => !B.includes(x)).sort();
}
function vennVisu(op) {
  const fillA = op === 'union' || op === 'unionall' || op === 'except', fillB = op === 'union' || op === 'unionall', inter = op === 'intersect';
  const res = setResult(op);
  const svg = `<svg class="dg" viewBox="0 0 300 190" width="300" height="190" role="img" aria-label="Diagramme de Venn ${SETS[op].lab}">
<defs><clipPath id="vclipB"><circle cx="185" cy="95" r="70"/></clipPath><mask id="vmaskB"><rect width="300" height="190" fill="#fff"/><circle cx="185" cy="95" r="70" fill="#000"/></mask></defs>
${fillA ? `<circle cx="115" cy="95" r="70" fill="var(--acc)" fill-opacity=".35" ${op === 'except' ? 'mask="url(#vmaskB)"' : ''}/>` : ''}
${fillB ? `<circle cx="185" cy="95" r="70" fill="var(--acc)" fill-opacity=".35"/>` : ''}
${inter ? `<circle cx="115" cy="95" r="70" fill="var(--acc)" fill-opacity=".45" clip-path="url(#vclipB)"/>` : ''}
<circle cx="115" cy="95" r="70" fill="none" stroke="var(--acc2)" stroke-width="2"/><circle cx="185" cy="95" r="70" fill="none" stroke="var(--acc2)" stroke-width="2"/>
<text x="70" y="22" font-size="13" font-weight="700">A : élèves</text><text x="190" y="22" font-size="13" font-weight="700">B : profs</text></svg>`;
  return `<div class="seg">${Object.entries(SETS).map(([k, s]) => `<button data-set="${k}" class="${k === op ? 'on' : ''}">${s.lab}</button>`).join('')}</div>
${code(`SELECT Ville FROM Eleve\n${SETS[op].lab}\nSELECT Ville FROM Prof;`, true)}
<div class="vis">${svg}${miniTable(`RÉSULTAT (${res.length} ligne${res.length > 1 ? 's' : ''})`, ['Ville'], res.map(v => [v]))}</div>
<div class="explain">${SETS[op].t}</div>`;
}
document.addEventListener('click', e => {
  const j = e.target.closest('[data-join]'); if (j) { $('#joinvis').innerHTML = joinVisu(j.dataset.join); return; }
  const g = e.target.closest('[data-gb]'); if (g && !g.disabled) { $('#gbvis').innerHTML = gbVisu(+g.dataset.gb); return; }
  const s = e.target.closest('[data-set]'); if (s) { $('#vennvis').innerHTML = vennVisu(s.dataset.set); }
});

const memo = '<span class="memo-tag">mémo</span>';

const CHAPTERS = [
  { id: 'voc', n: '0', t: 'Vocabulaire & modèle', html: () => `
<h2>Vocabulaire, sous-langages et modèle de données</h2>
<h3>Vocabulaire</h3>
<div class="tw"><table class="t">
<tr><th>Sigle</th><th>Signification</th><th>Définition</th></tr>
<tr><td><b>BD</b></td><td>Base de Données</td><td>Stockage des données</td></tr>
<tr><td><b>BDR</b></td><td>Base de Données Relationnelle</td><td>Données organisées <b>en tables</b> ; les liens entre tables se font via les données (<b>clés primaires et étrangères</b>)</td></tr>
<tr><td><b>SGBD</b></td><td>Système de Gestion de Base de Données</td><td>Éléments mis à disposition pour <b>manipuler les données</b></td></tr>
<tr><td><b>SGBDR</b></td><td>SGBD Relationnel</td><td>Oracle, SQL Server (Microsoft), PostgreSQL, MySQL, DB2 (IBM), SQLite…</td></tr>
<tr><td><b>SQL</b></td><td>Structured Query Language</td><td>Langage de requête structuré</td></tr>
</table></div>
<h3>Les 4 sous-langages de SQL</h3>
<div class="tw"><table class="t">
<tr><th>Sous-langage</th><th>Rôle</th><th>Instructions</th></tr>
<tr><td><b>DDL</b> (Data Definition Language) = LDD</td><td><b>Créer, modifier, supprimer les structures</b> de la base</td><td><code>CREATE</code>, <code>ALTER</code>, <code>DROP</code></td></tr>
<tr><td><b>DML</b> (Data Manipulation Language) = LMD</td><td><b>Manipuler les données</b> contenues dans la base</td><td><code>SELECT</code>, <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code></td></tr>
<tr><td><b>DCL</b> (Data Control Language) = LCD</td><td>Gérer la <b>sécurité des accès</b> aux données</td><td><code>GRANT</code>, <code>REVOKE</code></td></tr>
<tr><td><b>TCL</b> (Transaction Control Language)</td><td>Gérer la <b>validation ou non des mises à jour</b></td><td><code>COMMIT</code>, <code>ROLLBACK</code></td></tr>
</table></div>
${tip('<b>D</b>éfinition = structure (DDL) · <b>M</b>anipulation = données (DML) · <b>C</b>ontrôle = droits (DCL) · <b>T</b>ransaction = valider/annuler (TCL).')}
<h3>Ce que permet le DDL</h3>
<ul>
<li>Création, modification et suppression de <b>tables</b></li>
<li><b>Types de données</b> (en SQLite : <code>INTEGER</code>, <code>REAL</code>, <code>TEXT</code>, <code>BLOB</code>)</li>
<li><b>Intégrité</b> des données : clés primaires, étrangères, unicité…</li>
<li>Création d’<b>index</b>, de <b>vues</b></li>
</ul>
<h3>Le modèle utilisé dans le cours (et dans cette appli)</h3>
<p><b>MCD</b> : CLIENT <i>passe</i> COMMANDE (1,n – 1,1) · COMMANDE <i>concerne</i> PRODUIT (1,n – 0,n) avec <b>Qté commandée</b> · COMMANDE <i>correspond</i> à LIVRAISON (1,n – 1,1) · LIVRAISON <i>sort du stock</i> PRODUIT (1,n – 0,n) avec <b>Qté sortie</b>.</p>
<p><b>MLD</b> : les associations porteuses de données deviennent des tables (<b>Détail commande</b>, <b>Sortie stock</b>) dont la clé primaire est <b>composée</b> des deux clés étrangères.</p>
<figure>${mld()}<figcaption>Modèle logique de la base d’entraînement (noms sans accents pour faciliter la saisie). Tables bonus pour les exercices : Eleve, Prof, Employe.</figcaption></figure>
${key('Une <b>clé primaire</b> identifie chaque ligne (unique, jamais NULL). Une <b>clé étrangère</b> reprend la clé primaire d’une autre table : c’est elle qui sert aux <b>jointures</b>.')}` },

  { id: 'select', n: '1', t: 'SELECT : projeter, trier', html: () => `
<h2>1. Sélection des données (sans jointure)</h2>
<h3>Structure complète d’une requête</h3>
${code(`SELECT [DISTINCT] éléments d'extraction
FROM tables sources
[WHERE conditions ou restrictions]
[GROUP BY regroupements]
[HAVING conditions sur les regroupements]
[ORDER BY tris]
[LIMIT nombre [OFFSET nombre]];`)}
${key('L’<b>ordre des clauses est imposé</b> : SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT. Les crochets [ ] = clauses facultatives.')}
${code(`SELECT Raison_Sociale FROM Client;`, true)}
<h3>Éléments d’extraction (après SELECT)</h3>
<ul>
<li><b>Des colonnes</b> et des <b>champs calculés</b> :</li>
</ul>
${code(`SELECT Designation, Prix_Unitaire * 1.2 FROM Produit;`, true)}
<ul><li><b>*</b> = l’ensemble des colonnes :</li></ul>
${code(`SELECT * FROM Produit;`, true)}
<ul><li>Des <b>fonctions d’agrégat</b> : <code>COUNT</code> (comptage), <code>AVG</code> (moyenne), <code>MAX</code>, <code>MIN</code>, <code>SUM</code> (somme)</li></ul>
${code(`SELECT MAX(Quantite_Stock) FROM Produit;`, true)}
<h3>Renommer : AS ${memo}</h3>
<p><code>AS</code> renomme une colonne <b>seulement pour l’affichage</b> du résultat (très utile pour un calcul) :</p>
${code(`SELECT Designation, Prix_Unitaire * 1.2 AS Prix_TTC FROM Produit;`, true)}
<p>On peut aussi donner un <b>alias à une table</b> : <code>FROM Produit p</code> puis <code>p.Designation</code>.</p>
<h3>Doublons, tris et limites</h3>
<ul>
<li><b>DISTINCT</b> « supprime » les doublons du résultat.</li>
<li><b>ORDER BY</b> trie : <b>ASC</b> (croissant, <b>par défaut</b>) ou <b>DESC</b> (décroissant). Tri possible sur plusieurs colonnes.</li>
<li><b>LIMIT</b> limite le nombre de lignes affichées, <b>OFFSET</b> décale le début.</li>
</ul>
${code(`SELECT DISTINCT Ville FROM Client;`, true)}
${code(`-- par ville, puis par raison sociale en cas d'égalité
SELECT Raison_Sociale, Ville FROM Client
ORDER BY Ville, Raison_Sociale;`, true)}
${code(`SELECT * FROM Client LIMIT 3 OFFSET 2;
-- 3 clients à partir du TROISIÈME (on saute les 2 premiers)`, true)}
${trap('<code>LIMIT 10 OFFSET 2</code> = 10 lignes <b>à partir de la 3ᵉ</b> (OFFSET 2 saute 2 lignes). Et sans ORDER BY, l’ordre des lignes n’est pas garanti : pour « les 3 plus chers », il faut <code>ORDER BY Prix DESC LIMIT 3</code>.')}` },

  { id: 'where', n: '2', t: 'WHERE : conditions', html: () => `
<h2>Conditions ou restrictions : WHERE</h2>
<p><b>WHERE</b> ajoute des conditions booléennes : seules les <b>lignes</b> qui respectent les conditions sont sélectionnées.</p>
<div class="tw"><table class="t">
<tr><th>Opérateurs</th><th>Sens</th></tr>
<tr><td><code>=  &lt;  &lt;=  &gt;=  &gt;  &lt;&gt;</code></td><td>Comparaisons (<code>&lt;&gt;</code> ou <code>!=</code> = différent)</td></tr>
<tr><td><code>BETWEEN a AND b</code></td><td>Appartenance à un intervalle, <b>bornes incluses</b></td></tr>
<tr><td><code>IN (…)</code> / <code>NOT IN (…)</code></td><td>Appartenance (ou non) à un ensemble de valeurs ou à une sous-requête</td></tr>
<tr><td><code>LIKE</code> / <code>NOT LIKE</code></td><td>Comparaison de chaînes avec jokers</td></tr>
<tr><td><code>IS NULL</code> / <code>IS NOT NULL</code></td><td>Valeur non renseignée (ou renseignée)</td></tr>
<tr><td><code>AND</code>, <code>OR</code>, <code>NOT</code></td><td>Combinaison logique des conditions</td></tr>
</table></div>
${code(`SELECT Designation FROM Produit
WHERE (Prix_Unitaire >= 10 AND Quantite_Stock >= 40);`, true)}
<h3>BETWEEN</h3>
${code(`SELECT Num_Commande FROM Commande
WHERE Date_Commande BETWEEN '2024-02-01' AND '2024-04-30';`, true)}
<h3>IN / NOT IN</h3>
${code(`SELECT Raison_Sociale FROM Client
WHERE Ville IN ('Paris', 'Lyon', 'Marseille');`, true)}
<p><code>Ville IN ('Paris','Lyon')</code> équivaut à <code>Ville = 'Paris' OR Ville = 'Lyon'</code>.</p>
<h3>LIKE et les jokers</h3>
<ul><li><code>%</code> correspond à <b>n’importe quelle chaîne</b> (y compris vide)</li><li><code>_</code> correspond à <b>un et un seul caractère</b></li></ul>
${code(`SELECT Raison_Sociale FROM Client WHERE Raison_Sociale LIKE '_a%';
-- 2e lettre = a : Garage Dupont, Café du Port`, true)}
<div class="tw"><table class="t"><tr><th>Motif</th><th>Signifie</th></tr>
<tr><td><code>'DE%'</code></td><td>commence par DE</td></tr><tr><td><code>'%son'</code></td><td>se termine par son</td></tr>
<tr><td><code>'%USB%'</code></td><td>contient USB</td></tr><tr><td><code>'_a%'</code></td><td>2ᵉ caractère = a</td></tr><tr><td><code>'___'</code></td><td>exactement 3 caractères</td></tr></table></div>
<h3>NULL ${memo}</h3>
<p>NULL = valeur <b>non définie</b> (non renseignée). <b>0 n’est pas NULL</b>, une chaîne vide non plus. On teste avec <code>IS NULL</code> / <code>IS NOT NULL</code>, <b>jamais avec =</b>.</p>
${code(`SELECT Raison_Sociale FROM Client WHERE Telephone IS NULL;`, true)}
<h3>Autres outils du mémo ${memo}</h3>
<ul>
<li>Les <b>quotes</b> sont obligatoires autour des <b>chaînes</b> et des <b>dates</b> : <code>WHERE Ville = 'Lyon'</code>.</li>
<li><code>UPPER(col)</code> / <code>LOWER(col)</code> pour comparer sans se soucier de la casse : <code>WHERE UPPER(Categorie) = 'BUREAU'</code>.</li>
<li>Commentaires : <code>-- commentaire</code> (tout SGBD).</li>
</ul>
${trap('<code>WHERE Telephone = NULL</code> ne renvoie <b>rien</b> (une comparaison avec NULL n’est jamais vraie) : il faut <code>IS NULL</code>.')}
${trap('<b>AND est prioritaire sur OR</b> : <code>WHERE Ville = \'Lyon\' OR Ville = \'Paris\' AND Telephone IS NULL</code> se lit <code>Lyon OR (Paris AND tél NULL)</code>. Mets des <b>parenthèses</b> !')}` },

  { id: 'group', n: '3', t: 'Agrégats, GROUP BY, HAVING', html: () => `
<h2>Agrégats, regroupements et leurs restrictions</h2>
<h3>Les fonctions d’agrégat</h3>
<div class="tw"><table class="t">
<tr><th>Fonction</th><th>Renvoie</th></tr>
<tr><td><code>COUNT(*)</code></td><td>le nombre de <b>lignes</b></td></tr>
<tr><td><code>COUNT(col)</code></td><td>le nombre de lignes où <b>col n’est pas NULL</b></td></tr>
<tr><td><code>COUNT(DISTINCT col)</code></td><td>le nombre de valeurs <b>différentes</b></td></tr>
<tr><td><code>SUM(col)</code></td><td>la <b>somme</b> (à ne pas confondre avec COUNT !)</td></tr>
<tr><td><code>AVG(col)</code></td><td>la <b>moyenne</b></td></tr>
<tr><td><code>MIN(col)</code> / <code>MAX(col)</code></td><td>le minimum / maximum</td></tr>
</table></div>
${code(`SELECT COUNT(*) AS Nb_Lyonnais FROM Client WHERE Ville = 'Lyon';`, true)}
${code(`SELECT COUNT(*), COUNT(Telephone) FROM Client;  -- 8 et 6 (2 téléphones NULL)`, true)}
<h3>GROUP BY et HAVING</h3>
<ul>
<li><b>GROUP BY</b> regroupe les lignes ayant la même valeur (utilisé avec les fonctions d’agrégat) → <b>une ligne de résultat par groupe</b>.</li>
<li><b>HAVING</b> met une condition sur une <b>fonction d’agrégat</b> → filtre les <b>groupes</b>.</li>
</ul>
<h3>L’exemple du cours, pas à pas</h3>
<div id="gbvis" class="card">${gbVisu(0)}</div>
${key('<b>WHERE</b> filtre les <b>lignes AVANT</b> le regroupement ; <b>HAVING</b> filtre les <b>groupes APRÈS</b>. Ordre d’exécution : FROM → WHERE → GROUP BY → agrégats → HAVING → SELECT → ORDER BY.')}
<h3>La même chose sur la base d’entraînement</h3>
${code(`SELECT Num_Produit, SUM(Qte_Commandee)
FROM Detail_Commande
WHERE Qte_Commandee >= 5
GROUP BY Num_Produit
HAVING SUM(Qte_Commandee) >= 10;`, true)}
${code(`-- Nombre de professeurs par bureau
SELECT Bureau, COUNT(*) FROM Prof GROUP BY Bureau;`, true)}
${code(`-- Bureaux qui accueillent plus de 2 professeurs
SELECT Bureau FROM Prof GROUP BY Bureau HAVING COUNT(*) > 2;`, true)}
${trap('Règle du mémo : avec GROUP BY, chaque colonne du SELECT doit être soit <b>dans le GROUP BY</b>, soit <b>dans une fonction d’agrégat</b>. <code>SELECT Ville, Raison_Sociale, COUNT(*) … GROUP BY Ville</code> est faux (Raison_Sociale n’est ni groupée ni agrégée).')}
${trap('Une condition sur un agrégat ne va <b>jamais dans le WHERE</b> : <code>WHERE SUM(x) > 10</code> est une erreur → <code>HAVING SUM(x) > 10</code>.')}` },

  { id: 'join', n: '4', t: 'Jointures', html: () => `
<h2>2. Jointures : sélection sur plusieurs tables</h2>
<p>Dans la clause FROM, on peut effectuer un <b>produit cartésien</b>, une <b>jointure interne</b>, une <b>jointure gauche</b> (ou droite) et une <b>jointure pleine</b>.</p>
<h3>Visualiseur (exemple des diapos)</h3>
<p class="small muted">Client : A, B, C. Commande : 1→A, 2→B, 3→B, 4→D (client D inexistant). Clique sur chaque type de jointure.</p>
<div id="joinvis" class="card">${joinVisu('inner')}</div>
<h3>Produit cartésien</h3>
<p>Croisement de 2 tables en affichant <b>toutes les possibilités</b> : nombre de lignes = l₁ × l₂, nombre de colonnes = c₁ + c₂.</p>
${code(`SELECT Adresse, Num_Commande FROM Client CROSS JOIN Commande;
-- équivalent :
SELECT Adresse, Num_Commande FROM Client, Commande;`, true)}
<h3>Jointure interne (INNER JOIN)</h3>
<p>Joint 2 tables en <b>établissant une relation</b> entre elles (en général clé étrangère = clé primaire). <code>INNER</code> est facultatif : <code>JOIN</code> seul = jointure interne.</p>
${code(`SELECT Adresse, Num_Commande
FROM Client INNER JOIN Commande
  ON Client.Code_Client = Commande.Code_Client;`, true)}
<h4>Équivalence entre INNER JOIN et WHERE</h4>
<p>La jointure interne est équivalente à une <b>restriction</b> sur le produit cartésien :</p>
${code(`SELECT Adresse, Num_Commande
FROM Client, Commande
WHERE Client.Code_Client = Commande.Code_Client;`, true)}
<h4>USING : quand les colonnes portent le même nom</h4>
${code(`SELECT Adresse, Num_Commande
FROM Client JOIN Commande USING (Code_Client);`, true)}
<p>${memo} <code>NATURAL JOIN</code> joint automatiquement sur <b>toutes</b> les colonnes de même nom.</p>
<h3>Jointure gauche (LEFT JOIN)</h3>
<p>Joint 2 tables en prenant la table de <b>gauche complète</b> ; les colonnes de droite sans correspondance valent <b>NULL</b>. ${memo} <code>RIGHT JOIN</code> fait l’inverse (table de droite complète). On peut écrire <code>LEFT OUTER JOIN</code>.</p>
${code(`SELECT Raison_Sociale, Num_Commande
FROM Client LEFT JOIN Commande
  ON Client.Code_Client = Commande.Code_Client;`, true)}
<h3>Jointure pleine (FULL JOIN)</h3>
<p>Joint 2 tables en prenant les <b>deux tables complètes</b>. USING est possible aussi.</p>
${code(`SELECT Raison_Sociale, Num_Commande
FROM Client FULL JOIN Commande
  ON Client.Code_Client = Commande.Code_Client;`, true)}
<h3>La « négation » : ce qui n’a PAS de correspondance</h3>
<p>En ajoutant une restriction sur les colonnes vides (NULL), on fait une <b>soustraction</b> :</p>
${code(`SELECT Raison_Sociale
FROM Client LEFT JOIN Commande
  ON Client.Code_Client = Commande.Code_Client
WHERE Commande.Code_Client IS NULL;`, true)}
<p>Même résultat avec <b>NOT IN</b> et une sous-requête :</p>
${code(`SELECT Raison_Sociale FROM Client
WHERE Code_Client NOT IN (SELECT Code_Client FROM Commande);`, true)}
<h3>Jointure sur 3 tables</h3>
${code(`SELECT DISTINCT c.Raison_Sociale
FROM Client c
  JOIN Commande co ON c.Code_Client = co.Code_Client
  JOIN Detail_Commande d ON co.Num_Commande = d.Num_Commande
  JOIN Produit p ON d.Num_Produit = p.Num_Produit
WHERE p.Designation = 'Calculatrice';`, true)}
<h3>Auto-jointure ${memo}</h3>
<p>On joint une table <b>avec elle-même</b> : il faut <b>obligatoirement un alias</b> pour distinguer les deux occurrences.</p>
${code(`SELECT e.Nom AS Employe, c.Nom AS Chef
FROM Employe e JOIN Employe c ON e.Num_Chef = c.Num_Empl;`, true)}
${key('Mémo : une jointure = un <b>produit cartésien suivi d’une sélection</b> selon le critère de jointure (le plus souvent une <b>équi-jointure</b> « = »). Toujours <b>une condition de jointure par table ajoutée</b> (n tables → n − 1 conditions).')}
${trap('Oublier la condition de jointure (<code>FROM Client, Commande</code> sans WHERE) → <b>produit cartésien</b> : 8 × 10 = 80 lignes au lieu de 10 !')}
${trap('Une colonne présente dans les deux tables (<code>Code_Client</code>) doit être <b>préfixée</b> : <code>Client.Code_Client</code>, sinon erreur « ambiguous column ».')}` },

  { id: 'set', n: '5', t: 'Opérations ensemblistes', html: () => `
<h2>3. Opérations ensemblistes</h2>
<p>SQL propose les opérateurs ensemblistes classiques <b>entre 2 requêtes</b> :</p>
<div class="tw"><table class="t">
<tr><th>Opération</th><th>Mot-clé</th><th>Résultat</th></tr>
<tr><td>Intersection</td><td><code>INTERSECT</code></td><td>A ∩ B : lignes présentes dans les deux</td></tr>
<tr><td>Union</td><td><code>UNION</code></td><td>A ∪ B : toutes les lignes, <b>doublons éliminés</b></td></tr>
<tr><td>Union complète</td><td><code>UNION ALL</code></td><td>toutes les lignes, <b>doublons conservés</b></td></tr>
<tr><td>Différence</td><td><code>EXCEPT</code> (<code>MINUS</code> en Oracle)</td><td>A − B : lignes de A absentes de B</td></tr>
</table></div>
<div id="vennvis" class="card">${vennVisu('union')}</div>
<h3>Exemples du mémo</h3>
${code(`-- Villes où habitent à la fois des élèves et des professeurs
SELECT DISTINCT Ville FROM Eleve
INTERSECT
SELECT DISTINCT Ville FROM Prof;`, true)}
${code(`-- Villes où habitent seulement des élèves (pas de professeur)
SELECT Ville FROM Eleve
EXCEPT
SELECT Ville FROM Prof;`, true)}
${key('Les deux requêtes doivent avoir le <b>même nombre de colonnes</b>, de <b>types compatibles</b>, dans le <b>même ordre</b>. Mémo : A ∪ B = A + B − A ∩ B.')}
${trap('<code>A EXCEPT B</code> ≠ <code>B EXCEPT A</code> : l’ordre compte (c’est une soustraction). <code>MINUS</code> n’existe pas en SQLite/PostgreSQL : on écrit <code>EXCEPT</code>.')}
${tip('Une différence peut aussi s’écrire avec <code>NOT IN</code> ou <code>LEFT JOIN … IS NULL</code>, et une intersection avec <code>IN</code>.')}` },

  { id: 'sub', n: '6', t: 'Sous-requêtes', html: () => `
<h2>Sous-requêtes ${memo}</h2>
<p>Le critère d’une clause WHERE (ou HAVING) peut être <b>le résultat d’un SELECT</b>, écrit entre parenthèses.</p>
<h3>Sous-requête qui renvoie UNE valeur</h3>
<p>Avec un opérateur classique (=, &lt;, &gt;…), la sous-requête doit ramener <b>une seule ligne et une seule colonne</b>.</p>
${code(`-- Produits plus chers que le prix moyen
SELECT Designation, Prix_Unitaire FROM Produit
WHERE Prix_Unitaire > (SELECT AVG(Prix_Unitaire) FROM Produit);`, true)}
<h3>IN / NOT IN : la sous-requête renvoie une liste</h3>
${code(`SELECT Designation FROM Produit
WHERE Num_Produit IN (SELECT Num_Produit FROM Detail_Commande WHERE Num_Commande = 105);`, true)}
<h3>EXISTS / NOT EXISTS</h3>
<p><code>EXISTS (sous-requête)</code> est <b>vrai si la sous-requête renvoie au moins une ligne</b> (même remplie de NULL), faux sinon. <code>NOT EXISTS</code> teste l’absence de données. La sous-requête utilise en général une colonne de la requête principale (sous-requête <b>corrélée</b>).</p>
${code(`SELECT Raison_Sociale FROM Client c
WHERE EXISTS (SELECT * FROM Commande co WHERE co.Code_Client = c.Code_Client);`, true)}
${code(`SELECT Raison_Sociale FROM Client c
WHERE NOT EXISTS (SELECT * FROM Commande co WHERE co.Code_Client = c.Code_Client);`, true)}
<h3>ANY et ALL</h3>
<div class="tw"><table class="t">
<tr><th>Mot-clé</th><th>La comparaison est vraie si…</th><th>Ensemble vide</th><th>Équivalent</th></tr>
<tr><td><code>&gt; ANY (…)</code></td><td>vraie pour <b>au moins un</b> élément</td><td>faux</td><td><code>&gt; (SELECT MIN …)</code></td></tr>
<tr><td><code>&gt; ALL (…)</code></td><td>vraie pour <b>tous</b> les éléments</td><td>vrai</td><td><code>&gt; (SELECT MAX …)</code></td></tr>
</table></div>
${code(`-- Mémo (syntaxe Oracle / PostgreSQL) : le bureau qui accueille le plus de profs
SELECT Bureau FROM Prof
GROUP BY Bureau
HAVING COUNT(*) >= ALL (SELECT COUNT(*) FROM Prof GROUP BY Bureau);`)}
<p>SQLite ne connaît pas ANY/ALL ; l’équivalent exécutable dans le labo :</p>
${code(`SELECT Bureau FROM Prof
GROUP BY Bureau
HAVING COUNT(*) = (SELECT MAX(nb) FROM (SELECT COUNT(*) AS nb FROM Prof GROUP BY Bureau));`, true)}
${tip('<code>= ANY (…)</code> est équivalent à <code>IN (…)</code>. <code>&lt;&gt; ALL (…)</code> est équivalent à <code>NOT IN (…)</code>.')}
${trap('<code>WHERE Prix = (SELECT Prix FROM Produit)</code> plante si la sous-requête renvoie plusieurs lignes : utilise <code>IN</code>, <code>ANY</code>/<code>ALL</code> ou un agrégat (MAX, MIN, AVG).')}` },

  { id: 'ddl', n: '7', t: 'Créer & modifier (DDL/DML)', html: () => `
<h2>Créer et modifier : tables, données, vues, droits ${memo}</h2>
<h3>CREATE TABLE et contraintes</h3>
${code(`CREATE TABLE Fournisseur (
  Num_Fournisseur INTEGER PRIMARY KEY,
  Nom VARCHAR(50) NOT NULL,
  Ville VARCHAR(30),
  Email VARCHAR(80) UNIQUE,
  Note INTEGER CHECK (Note BETWEEN 0 AND 20)
);`, true)}
<div class="tw"><table class="t">
<tr><th>Contrainte</th><th>Rôle</th></tr>
<tr><td><code>PRIMARY KEY (col1, col2…)</code></td><td>Clé primaire : identifie la ligne ; <b>aucune valeur NULL</b>, pas de doublon. Composée si plusieurs colonnes.</td></tr>
<tr><td><code>FOREIGN KEY (col) REFERENCES table (col')</code></td><td>Clé étrangère : la valeur doit exister dans la table référencée (si col' omise → sa clé primaire)</td></tr>
<tr><td><code>UNIQUE (col…)</code></td><td>Interdit deux valeurs identiques</td></tr>
<tr><td><code>NOT NULL</code></td><td>Valeur obligatoire</td></tr>
<tr><td><code>CHECK (condition)</code></td><td>Condition à respecter</td></tr>
<tr><td><code>CONSTRAINT nom …</code></td><td>Donne un nom à une contrainte</td></tr>
</table></div>
${code(`CREATE TABLE Detail_Commande (
  Num_Commande INTEGER,
  Num_Produit INTEGER,
  Qte_Commandee INTEGER,
  CONSTRAINT pk_detail PRIMARY KEY (Num_Commande, Num_Produit),
  CONSTRAINT fk_cmd FOREIGN KEY (Num_Commande) REFERENCES Commande (Num_Commande),
  CONSTRAINT fk_prod FOREIGN KEY (Num_Produit) REFERENCES Produit (Num_Produit)
);`)}
<h3>Principaux types de données</h3>
<div class="tw"><table class="t">
<tr><th>Type</th><th>Contenu</th></tr>
<tr><td><code>CHAR(n)</code> / <code>VARCHAR(n)</code></td><td>Chaîne de longueur <b>fixe</b> / <b>variable</b> (max n)</td></tr>
<tr><td><code>SMALLINT</code>, <code>INTEGER</code></td><td>Entiers (16 / 32 bits)</td></tr>
<tr><td><code>NUMBER(n,d)</code></td><td>Décimal de n chiffres dont d après la virgule : NUMBER(7,2) = 5 avant, 2 après</td></tr>
<tr><td><code>REAL</code>, <code>FLOAT</code></td><td>Nombres à virgule flottante</td></tr>
<tr><td><code>DATE</code>, <code>TIME</code>, <code>TIMESTAMP</code></td><td>Date / heure / date + heure précise</td></tr>
<tr><td>SQLite : <code>INTEGER</code>, <code>REAL</code>, <code>TEXT</code>, <code>BLOB</code></td><td>Les 4 types cités dans le cours</td></tr>
</table></div>
<h3>ALTER TABLE / DROP TABLE</h3>
${code(`ALTER TABLE Client ADD COLUMN Email TEXT;          -- ajouter une colonne
ALTER TABLE Client MODIFY (Ville VARCHAR(60));     -- modifier (Oracle/MySQL)
ALTER TABLE Client DROP COLUMN Email;              -- supprimer une colonne
ALTER TABLE Client ADD CONSTRAINT u_tel UNIQUE (Telephone);
DROP TABLE Fournisseur;                            -- supprime structure + données`)}
<h3>INSERT, UPDATE, DELETE (DML)</h3>
${code(`INSERT INTO Client (Code_Client, Raison_Sociale, Ville)
VALUES ('C09', 'Studio Lumière', 'Bordeaux');`, true)}
<ul><li>Avec la liste de colonnes : les colonnes non citées valent <b>NULL</b>.</li><li>Sans liste : il faut donner <b>toutes</b> les valeurs <b>dans l’ordre de création</b> de la table.</li><li><code>INSERT INTO t SELECT …</code> insère le résultat d’une requête.</li></ul>
${code(`UPDATE Produit SET Prix_Unitaire = Prix_Unitaire * 1.1
WHERE Categorie = 'Papier';`, true)}
${code(`DELETE FROM Detail_Commande WHERE Num_Commande = 110;`, true)}
${trap('<b>UPDATE ou DELETE sans WHERE</b> → <b>toutes les lignes</b> sont modifiées / supprimées ! <code>DELETE FROM t</code> vide la table (la structure reste) ; <code>DROP TABLE t</code> supprime la table elle-même. <code>TRUNCATE TABLE t</code> vide la table et libère la place.')}
<h3>Vues</h3>
<p>Une vue est une <b>requête stockée</b> qu’on interroge comme une table (table virtuelle). On ne peut pas modifier le schéma d’une vue : il faut la <b>supprimer et la recréer</b>. <code>DROP VIEW</code> ne touche pas aux données.</p>
${code(`CREATE VIEW Profs_Par_Bureau AS
  SELECT Bureau, COUNT(*) AS Nb FROM Prof GROUP BY Bureau;
SELECT * FROM Profs_Par_Bureau;`, true)}
<h3>Droits (DCL) et transactions (TCL)</h3>
${code(`GRANT SELECT, UPDATE ON Client TO dupont WITH GRANT OPTION;
REVOKE UPDATE ON Client FROM dupont;
BEGIN TRANSACTION;
  UPDATE Produit SET Quantite_Stock = Quantite_Stock - 5 WHERE Num_Produit = 1;
COMMIT;      -- valide   (ROLLBACK annule)`)}
<p><code>WITH GRANT OPTION</code> : l’utilisateur pourra à son tour <b>transmettre</b> ces droits.</p>
<h3>CASE WHEN (colonne conditionnelle)</h3>
${code(`SELECT Designation,
  CASE WHEN Quantite_Stock = 0 THEN 'Rupture'
       WHEN Quantite_Stock < 50 THEN 'Stock faible'
       ELSE 'OK' END AS Etat_Stock
FROM Produit;`, true)}
<p class="small muted">Le mémo B présente aussi des notions Oracle avancées (PL/SQL, triggers, relationnel-objet) : elles ne figurent pas dans les diapos du cours.</p>` }

/* passe à la ligne avant les clauses principales (hors sous-requêtes) pour l'affichage */
function prettySql(sql) {
  let depth = 0, out = '';
  const re = /\(|\)|\s+(FROM|WHERE|GROUP BY|HAVING|ORDER BY|LIMIT|(?:LEFT |RIGHT |FULL |CROSS |INNER )?JOIN|EXCEPT|UNION ALL|UNION|INTERSECT)\s+|[^()\s]+|\s+/g;
  let m;
  while ((m = re.exec(sql))) {
    if (m[0] === '(') depth++;
    if (m[0] === ')') depth--;
    const setOp = /^(EXCEPT|UNION|UNION ALL|INTERSECT)$/.test(m[1] || '');
    out += m[1] ? (depth === 0 ? '\n' + m[1] + (setOp ? '\n' : ' ') : ' ' + m[1] + ' ') : m[0];
  }
  return out;
}

function prepQ(item) { return Object.assign({}, item, { shown: shuffle(item.opts.map((t, i) => ({ t, ok: i === 0 }))) }); }
function viewQuiz(arg) {
  if (!arg) return quizSetup();
  let pool;
  if (arg === 'erreurs') { const w = wrongSet(); pool = QB.filter(x => w[x.id]); }
  else if (arg === 'tout') pool = QB.slice();

  if (!pool.length) { app.innerHTML = `<div class="qwrap card"><h2>Rien à réviser ici</h2><p class="muted">${arg === 'erreurs' ? 'Aucune erreur enregistrée. Bravo !' : 'Thème introuvable.'}</p><a class="btn pri" href="#quiz">Retour</a></div>`; return; }
  const n = Math.min(parseInt(store.get('quizN', 15), 10) || 15, pool.length);
  runQuiz(shuffle(pool).slice(0, arg === 'erreurs' ? pool.length : n).map(prepQ), arg);
}
function quizSetup() {
  const b = best(), w = Object.keys(wrongSet()).length;
  app.innerHTML = `<div class="qwrap">

  $('#qn').value = String(store.get('quizN', 15));
  $('#qn').onchange = e => store.set('quizN', parseInt(e.target.value, 10));
}
function runQuiz(qs, key) {
  let i = 0, score = 0, answered = false;
  const log = [];
  const render = () => {
    const x = qs[i];
    app.innerHTML = `<div class="qwrap">
<div class="qhead"><span class="pill acc">${CH_LABEL[x.ch]}</span><span class="muted small">Question ${i + 1} / ${qs.length} · score ${score}</span></div>
<div class="bar"><i style="width:${i / qs.length * 100}%"></i></div>
<div class="card" style="margin-top:14px">
<div class="qtxt">${fmt(x.text)}</div>${x.code ? code(x.code) : ''}
<div class="opts">${x.shown.map((o, k) => `<button class="opt" data-k="${k}"><span class="l">${k + 1}</span><span>${fmt(o.t)}</span></button>`).join('')}</div>
<div id="fb"></div></div></div>`;
    answered = false;
    $$('.opt').forEach(b => b.onclick = () => pick(+b.dataset.k));
  };
  const pick = k => {
    if (answered) return; answered = true;
    const x = qs[i], ok = x.shown[k].ok;
    if (ok) score++;
    log.push({ x, k, ok });
    const w = wrongSet(); if (ok) delete w[x.id]; else w[x.id] = 1; store.set('wrong', w);
    $$('.opt').forEach((b, j) => { b.disabled = true; if (x.shown[j].ok) b.classList.add('good'); else if (j === k) b.classList.add('wrong'); });
    $('#fb').innerHTML = `<div class="exp"><b style="color:${ok ? 'var(--ok)' : 'var(--bad)'}">${ok ? 'Bonne réponse' : 'Raté'}.</b> ${fmt(x.exp)}</div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" id="nx">${i < qs.length - 1 ? 'Suivant →' : 'Voir le résultat'}</button></div>`;
    $('#nx').onclick = next; $('#nx').focus();
  };
  const next = () => { i++; if (i < qs.length) render(); else finish(); };
  const finish = () => {
    const pct = Math.round(score / qs.length * 100);
    if (CH_LABEL[key]) { const b = best(); b[key] = Math.max(b[key] || 0, pct); store.set('best', b); }
    const ko = log.filter(l => !l.ok);
    app.innerHTML = `<div class="qwrap"><div class="card" style="text-align:center">
<div class="score">${pct} %</div><p class="muted">${score} / ${qs.length} bonnes réponses${CH_LABEL[key] ? ' · ' + CH_LABEL[key] : ''}</p>
<p>${pct >= 90 ? 'Excellent, c’est maîtrisé.' : pct >= 70 ? 'Solide. Relis les corrections ci-dessous.' : 'À retravailler : relis le chapitre puis refais la série.'}</p>
<div class="row" style="justify-content:center">${ko.length ? `<button class="btn pri" id="redo">Refaire mes ${ko.length} erreur(s)</button>` : ''}<button class="btn" id="again">Nouvelle série</button><a class="btn ghost" href="#quiz">Autres thèmes</a></div></div>
${ko.length ? `<h3>Corrections</h3><div class="review">${ko.map(l => `<div class="it ko"><b>${fmt(l.x.text)}</b>${l.x.code ? code(l.x.code) : ''}<div class="small" style="margin-top:6px">Ta réponse : <span style="color:var(--bad)">${fmt(l.x.shown[l.k].t)}</span><br>Bonne réponse : <span style="color:var(--ok);font-weight:650">${fmt(l.x.opts[0])}</span></div><div class="small muted" style="margin-top:6px">${fmt(l.x.exp)}</div></div>`).join('')}</div>` : ''}</div>`;
    if (ko.length) $('#redo').onclick = () => runQuiz(ko.map(l => prepQ(l.x)), key);
    $('#again').onclick = () => viewQuiz(key);
  };
  const onKey = e => {
    if (/^[1-4]$/.test(e.key) && !answered) { const k = +e.key - 1; if (qs[i] && k < qs[i].shown.length) pick(k); }
    else if (e.key === 'Enter' && answered && $('#nx') && document.activeElement !== $('#nx')) { e.preventDefault(); next(); }
  };
  document.addEventListener('keydown', onKey);
  cleanup = () => document.removeEventListener('keydown', onKey);
  render();
}

<h2>Examen blanc</h2>
<p><b>18 QCM</b> tirés dans tout le cours, puis <b>4 requêtes à écrire</b> sur la base d’entraînement (SELECT/WHERE, GROUP BY, jointure, ensembliste ou sous-requête). Durée : <b>30 minutes</b>.</p>
<p class="muted small">Barème : 1 point par QCM, 3 points par requête juste, ramené sur 20. Tu peux exécuter tes requêtes pour voir leur résultat, mais la correction n’apparaît qu’à la fin.${SQL ? '' : engineErr ? ' Moteur SQL indisponible : l’examen ne contiendra que des QCM.' : ''}</p>
${b.exam != null ? `<p>Meilleure note : <b>${b.exam.toFixed(1).replace('.', ',')} / 20</b></p>` : ''}
<button class="btn pri" id="go">Lancer l’examen</button></div></div>`;
  $('#go').onclick = () => engineReady.then(startExam);
}
function startExam() {
  const pickQ = (chs, n) => shuffle(QB.filter(x => chs.includes(x.ch))).slice(0, n);
  const qcm = shuffle([...pickQ(['select', 'where'], 4), ...pickQ(['group'], 3), ...pickQ(['join'], 4), ...pickQ(['set', 'sub'], 2), ...pickQ(['ddl', 'voc'], 2), ...pickQ(['lire'], 3)]).map(x => Object.assign(prepQ(x), { kind: 'qcm' }));
  const pickE = (chs, lvMax) => shuffle(EXOS.filter(e => chs.includes(e.ch) && e.lv <= lvMax))[0];
  const exos = SQL ? [pickE(['select', 'where'], 2), pickE(['group'], 3), pickE(['join'], 3), pickE(['set', 'sub'], 2)].filter(Boolean).map(e => ({ kind: 'exo', ex: e })) : [];
  const items = [...qcm, ...exos];
  const ans = new Array(items.length).fill(null);
  let i = 0, done = false;
  const end = Date.now() + 30 * 60 * 1000;
  const tick = () => {
    const left = Math.max(0, end - Date.now()), t = $('#tm');
    if (t) { const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000); t.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; t.classList.toggle('low', left < 3 * 60000); }
    if (left <= 0 && !done) { toast('Temps écoulé !'); finish(); }
  };
  const iv = setInterval(tick, 500);
  const onKey = e => {
    if (done || items[i].kind !== 'qcm' || e.target.tagName === 'TEXTAREA') return;
    if (/^[1-4]$/.test(e.key)) { const k = +e.key - 1; if (k < items[i].shown.length) { ans[i] = k; if (i < items.length - 1) i++; render(); } }
  };
  document.addEventListener('keydown', onKey);
  cleanup = () => { clearInterval(iv); document.removeEventListener('keydown', onKey); };
  const isAnswered = k => items[k].kind === 'qcm' ? ans[k] != null : !!(ans[k] && ans[k].trim());
  const render = () => {
    const x = items[i];
    let body;
    if (x.kind === 'qcm') body = `<div class="qtxt">${fmt(x.text)}</div>${x.code ? code(x.code) : ''}<div class="opts">${x.shown.map((o, k) => `<button class="opt ${ans[i] === k ? 'sel' : ''}" data-k="${k}"><span class="l">${k + 1}</span><span>${fmt(o.t)}</span></button>`).join('')}</div>`;
    else body = `<span class="pill warn">Requête à écrire · 3 points</span><div class="qtxt" style="margin-top:8px">${esc(x.ex.q)}</div><details style="margin-bottom:8px"><summary class="small" style="cursor:pointer;color:var(--acc);font-weight:650">Schéma des tables</summary><div style="margin-top:8px">${schemaPanel(false)}</div></details><textarea class="ed" id="ed" spellcheck="false">${esc(ans[i] || '')}</textarea><div class="row" style="margin-top:8px"><button class="btn" id="run">▶ Exécuter</button><span class="muted small">Le résultat s’affiche, la correction viendra à la fin.</span></div><div class="res" id="res"></div>`;
    app.innerHTML = `<div class="qwrap">
<div class="qhead"><b>Examen blanc</b><span class="timer" id="tm">30:00</span></div>
<div class="dots">${items.map((it, k) => `<button class="${isAnswered(k) ? 'ans' : ''} ${k === i ? 'cur' : ''}" data-k="${k}" title="${it.kind === 'exo' ? 'Requête' : 'QCM'}">${it.kind === 'exo' ? 'R' + (k - qcm.length + 1) : k + 1}</button>`).join('')}</div>
<div class="card"><div class="muted small">${x.kind === 'exo' ? 'Requête' : 'Question'} ${i + 1} / ${items.length}</div>${body}
<div class="row" style="justify-content:space-between;margin-top:16px"><button class="btn ghost" id="pv" ${i === 0 ? 'disabled' : ''}>← Précédente</button>${i < items.length - 1 ? '<button class="btn" id="nx">Suivante →</button>' : ''}</div></div>
<div class="row" style="justify-content:flex-end;margin-top:14px"><span class="muted small">${items.filter((_, k) => isAnswered(k)).length} / ${items.length} répondues</span><button class="btn pri" id="sub">Rendre la copie</button></div></div>`;
    tick();
    $$('.opt').forEach(b => b.onclick = () => { ans[i] = +b.dataset.k; if (i < items.length - 1) i++; render(); });
    $$('.dots button').forEach(b => b.onclick = () => { i = +b.dataset.k; render(); });
    $('#pv').onclick = () => { if (i > 0) { i--; render(); } };
    if ($('#nx')) $('#nx').onclick = () => { i++; render(); };
    if (x.kind === 'exo') {
      const ed = $('#ed');
      ed.addEventListener('input', () => { ans[i] = ed.value; });
      const run = () => { const db = freshDb(); try { const r = x.ex.check ? (db.exec(ed.value), lastResult(db, x.ex.check)) : lastResult(db, ed.value); $('#res').innerHTML = resultTable(r, 40); } catch (e) { $('#res').innerHTML = `<div class="err">${esc(friendlyError(e.message, ed.value))}</div>`; } finally { db.close(); } };
      editorKeys(ed, run); $('#run').onclick = run;
    }
    $('#sub').onclick = () => { const miss = items.filter((_, k) => !isAnswered(k)).length; if (!miss || confirm(`${miss} question(s) sans réponse. Rendre quand même ?`)) finish(); };
  };
  const finish = () => {
    if (done) return; done = true; cleanup(); cleanup = null;
    let pts = 0, max = 0; const w = wrongSet();
    const results = items.map((x, k) => {
      if (x.kind === 'qcm') { max += 1; const ok = ans[k] != null && x.shown[ans[k]].ok; if (ok) { pts += 1; delete w[x.id]; } else w[x.id] = 1; return { ok }; }
      max += 3; if (!ans[k] || !ans[k].trim()) return { ok: false, why: 'Pas de réponse.' };
      const c = checkExercise(x.ex, ans[k]); if (c.ok) { pts += 3; const s = solved(); s[x.ex.id] = 1; store.set('solved', s); }
      return { ok: c.ok, why: c.err || c.why };
    });
    store.set('wrong', w);
    const note = Math.round(pts / max * 200) / 10;
    const b = best(); b.exam = Math.max(b.exam != null ? b.exam : 0, note); store.set('best', b);
    app.innerHTML = `<div class="qwrap"><div class="card" style="text-align:center">
<div class="score">${note.toFixed(1).replace('.', ',')} / 20</div><p class="muted">${pts} / ${max} points · QCM ${results.filter((r, k) => items[k].kind === 'qcm' && r.ok).length}/${qcm.length} · requêtes ${results.filter((r, k) => items[k].kind === 'exo' && r.ok).length}/${exos.length}</p>
<p>${note >= 16 ? 'Très bien : tu es prêt·e.' : note >= 12 ? 'Correct. Retravaille les erreurs ci-dessous puis refais un examen.' : 'Revois les chapitres concernés, refais les exercices, puis retente.'}</p>
<div class="row" style="justify-content:center"><button class="btn pri" id="re">Nouvel examen</button><a class="btn" href="#quiz/erreurs">Refaire mes erreurs QCM</a></div></div>
<h3>Corrigé</h3><div class="review">${items.map((x, k) => {
      const r = results[k];
      if (x.kind === 'qcm') return `<div class="it ${r.ok ? 'okk' : 'ko'}"><div class="row" style="justify-content:space-between"><span class="pill">${k + 1} · ${CH_LABEL[x.ch]}</span><span class="pill ${r.ok ? 'ok' : 'bad'}">${r.ok ? 'juste' : ans[k] == null ? 'sans réponse' : 'faux'}</span></div><b style="display:block;margin-top:8px">${fmt(x.text)}</b>${!r.ok ? `${x.code ? code(x.code) : ''}<div class="small" style="margin-top:6px">${ans[k] != null ? `Ta réponse : <span style="color:var(--bad)">${fmt(x.shown[ans[k]].t)}</span><br>` : ''}Bonne réponse : <span style="color:var(--ok);font-weight:650">${fmt(x.opts[0])}</span></div><div class="small muted" style="margin-top:6px">${fmt(x.exp)}</div>` : ''}</div>`;
      return `<div class="it ${r.ok ? 'okk' : 'ko'}"><div class="row" style="justify-content:space-between"><span class="pill warn">Requête · ${EX_CH[x.ex.ch]}</span><span class="pill ${r.ok ? 'ok' : 'bad'}">${r.ok ? '3 / 3' : '0 / 3'}</span></div><b style="display:block;margin-top:8px">${esc(x.ex.q)}</b>${ans[k] ? `<div class="small muted" style="margin-top:6px">Ta requête :</div>${code(ans[k])}` : ''}${!r.ok ? `<div class="small" style="color:var(--bad)">${esc(r.why || '')}</div><div class="small muted" style="margin-top:6px">Une solution :</div>${code(prettySql(x.ex.sol))}` : ''}</div>`;
    }).join('')}</div></div>`;
    $('#re').onclick = startExam;
    window.scrollTo(0, 0);
  };
  render();
}

/* =========================================================
   Routeur & thème
   ========================================================= */
const VIEWS = { home: viewHome, cours: viewCours, labo: viewLabo, exos: viewExos, quiz: viewQuiz, cartes: viewCartes, pieges: viewPieges, examen: viewExamen };
function route() {
  if (cleanup) { cleanup(); cleanup = null; }
  const [v, arg] = (location.hash.slice(1) || 'home').split('/');
  (VIEWS[v] || viewHome)(arg ? decodeURIComponent(arg) : undefined);
  $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.v === (VIEWS[v] ? v : 'home')));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
(function theme() {
  const saved = store.get('theme', null);
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  $('#themeBtn').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nx); store.set('theme', nx);
  };
})();
route();
</script>
</body>
</html>
