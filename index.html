<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision BPMN</title>
<meta name="description" content="Application de révision du cours de modélisation BPMN (R5.04) : cours illustré, memento interactif, flashcards, quiz et examen blanc.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0;--surface:#ffffff;--surface2:#efede7;--ink:#1c1a17;--muted:#6a655c;--line:#e0dcd2;
  --acc:#7b1f79;--acc-soft:#f4e6f3;--acc2:#0e8fa3;--acc2-soft:#e2f4f6;
  --ok:#1d7f46;--ok-soft:#e3f3e8;--bad:#bf3228;--bad-soft:#fbe7e4;--warn:#a86a12;--warn-soft:#fbf0dc;
  --sym:#ffffff;--evs:#e3f4e3;--eve:#fbe2df;--evi:#fcf1d4;--gwf:#fcf5cf;--taskf:#ffffff;--poolf:#ffffff;--mid:#d9d4c9;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141317;--surface:#1d1c21;--surface2:#26252c;--ink:#ecebe7;--muted:#a19d95;--line:#34323a;
    --acc:#e08fdd;--acc-soft:#3a2439;--acc2:#4ccadd;--acc2-soft:#193338;
    --ok:#5cc98a;--ok-soft:#1b3326;--bad:#f07a70;--bad-soft:#3b2120;--warn:#e6b25a;--warn-soft:#382d18;
    --sym:#1d1c21;--evs:#1c3322;--eve:#3b2020;--evi:#393119;--gwf:#35311a;--taskf:#1d1c21;--poolf:#1a191e;--mid:#4a4750;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#141317;--surface:#1d1c21;--surface2:#26252c;--ink:#ecebe7;--muted:#a19d95;--line:#34323a;
  --acc:#e08fdd;--acc-soft:#3a2439;--acc2:#4ccadd;--acc2-soft:#193338;
  --ok:#5cc98a;--ok-soft:#1b3326;--bad:#f07a70;--bad-soft:#3b2120;--warn:#e6b25a;--warn-soft:#382d18;
  --sym:#1d1c21;--evs:#1c3322;--eve:#3b2020;--evi:#393119;--gwf:#35311a;--taskf:#1d1c21;--poolf:#1a191e;--mid:#4a4750;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
button{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:750;letter-spacing:-.01em}
h3{font-size:1.12rem;font-weight:700;margin-top:1.6em}
p{margin:.45em 0 .8em}
ul{margin:.3em 0 .9em;padding-left:1.25em}
li{margin:.25em 0}
b,strong{font-weight:650}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand svg{flex:none}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
nav.tabs a:hover{background:var(--surface2);color:var(--ink)}
nav.tabs a.on{background:var(--acc);color:#fff}
:root[data-theme="dark"] nav.tabs a.on{color:#1a0f1a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs a.on{color:#1a0f1a}}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
@media (max-width:720px){.brand span{display:none}}

main{max-width:1180px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#1a0f1a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#1a0f1a}}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:650;background:var(--surface2);color:var(--muted)}
.pill.acc{background:var(--acc-soft);color:var(--acc)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
kbd{font:600 .78rem ui-monospace,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--surface2)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .card:first-child{background:linear-gradient(135deg,var(--acc-soft),var(--surface) 70%)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .v{font-size:1.6rem;font-weight:800}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);font-weight:800}
.steps li.done::before{content:"✓";background:var(--ok-soft);color:var(--ok)}

/* course */
.course{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
.course>*,.hero>*,.grid>*{min-width:0}
.side{position:sticky;top:74px;display:flex;flex-direction:column;gap:4px}
.side a{display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:550;font-size:.93rem;border:1px solid transparent}
.side a:hover{background:var(--surface)}
.side a.on{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow);color:var(--acc)}
.side a .ck{margin-left:auto;color:var(--ok);font-weight:800}
.side .num{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface2);font-size:.78rem;font-weight:750;flex:none}
@media (max-width:900px){
  .course{grid-template-columns:minmax(0,1fr)}
  .side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .side a{white-space:nowrap;background:var(--surface);border-color:var(--line)}
}
.lesson h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lesson h3{color:var(--acc)}
.lesson section{margin-bottom:8px}
.box{border-radius:12px;padding:12px 16px;margin:14px 0;border:1px solid}
.box>:first-child{margin-top:0}.box>:last-child{margin-bottom:0}
.box .bt{font-weight:750;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px}
.key{background:var(--acc2-soft);border-color:color-mix(in srgb,var(--acc2) 35%,transparent)}
.key .bt{color:var(--acc2)}
.trap{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.trap .bt{color:var(--bad)}
.tip{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.tip .bt{color:var(--warn)}
figure{margin:16px 0;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
figure svg{display:block;margin:0 auto}
figcaption{font-size:.84rem;color:var(--muted);margin-top:8px;text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:.92rem;margin:12px 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
table.t th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.tw{overflow-x:auto}
.symrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.sym{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);text-align:center;font-size:.86rem}
.sym svg{display:block;margin:0 auto 6px}
.sym b{display:block}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.readbtn.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

/* svg BPMN */
svg.bp{max-width:100%;height:auto;color:var(--ink);overflow:visible}
svg.bp text{fill:var(--ink);font-family:Inter,system-ui,sans-serif}
svg.bp .tx{dominant-baseline:central}
svg.bp .red{fill:var(--bad);font-weight:600}
svg.bp .accent{fill:var(--acc);font-weight:650}
svg.bp .mut{fill:var(--muted)}
svg.bp .b{font-weight:650}
.sk{stroke:var(--ink)}.sb{stroke:var(--sym)}.sr{stroke:var(--bad)}
.nf{fill:none}.fk{fill:var(--ink)}.fw{fill:var(--sym)}.fm{fill:var(--mid)}.fr{fill:var(--bad)}
.fs{fill:var(--evs)}.fe{fill:var(--eve)}.fi{fill:var(--evi)}.fg{fill:var(--gwf)}.ft{fill:var(--taskf)}.fp{fill:var(--poolf)}

/* memento */
.memo{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.mp{border-radius:14px;padding:14px;border-left:6px solid;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.mp h3{margin:0 0 10px;font-size:.95rem;text-transform:uppercase;letter-spacing:.06em}
.mp.act{border-left-color:#c9ae52;grid-column:span 4}.mp.mk{border-left-color:#c9ae52;grid-column:span 4}
.mp.gw{border-left-color:#a13a3a;grid-column:span 4}.mp.ev{border-left-color:#3d86c0;grid-column:span 12}
.mp.cn{border-left-color:#c8814a;grid-column:span 6}.mp.ot{border-left-color:#3aa55a;grid-column:span 6}
@media (max-width:900px){.mp.act,.mp.mk,.mp.gw,.mp.cn,.mp.ot{grid-column:span 12}}
.mitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.mi{border:1px dashed var(--line);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;background:transparent;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.mi:hover{background:var(--surface2)}
.mi .nm{font-size:.78rem;line-height:1.25;color:var(--muted)}
.mi.rev{border-style:solid;border-color:var(--acc2);background:var(--acc2-soft)}
.mi.rev .nm{color:var(--ink);font-weight:600}
.evtab{border-collapse:collapse;width:100%;min-width:720px}
.evtab th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px;font-weight:700;vertical-align:bottom;text-align:center;border-bottom:1px dashed var(--line)}
.evtab th.rh{text-align:left}
.evtab td{border-bottom:1px dashed var(--line);border-left:1px dashed var(--line);padding:4px;text-align:center;vertical-align:middle}
.evtab td.rh{text-align:left;font-weight:650;font-size:.86rem;border-left:0;white-space:nowrap}
.evtab .mi{min-height:62px;border:0;padding:4px}
.evtab .mi .nm{font-size:.68rem}

/* flashcards */
.fc-wrap{max-width:620px;margin:0 auto}
.fc{perspective:1400px;height:340px;cursor:pointer;margin:14px 0}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;overflow:auto}
.fc-b{transform:rotateY(180deg);background:linear-gradient(160deg,var(--acc-soft),var(--surface) 65%)}
.fc-f .q{font-size:1.2rem;font-weight:650}
.fc-b .a{font-size:1.15rem;font-weight:750;color:var(--acc);margin-bottom:8px}
.fc-b .d{font-size:.95rem;color:var(--ink)}
.fc .hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}

/* quiz */
.qwrap{max-width:780px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qtxt{font-size:1.15rem;font-weight:650;margin:6px 0 14px}
.opts{display:grid;gap:9px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .l{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:750;font-size:.85rem}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 16px;border-radius:12px;background:var(--surface2);border-left:4px solid var(--acc2)}
.qimg{margin:0 0 14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow-x:auto}
.qimg svg{display:block;margin:0 auto}
.score{font-size:3rem;font-weight:800;color:var(--acc);line-height:1}
.review{display:grid;gap:10px;margin-top:16px}
.review .it{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.review .it.ko{border-left:4px solid var(--bad)}
.review .it.okk{border-left:4px solid var(--ok)}
.timer{font:700 1.05rem ui-monospace,Consolas,monospace;padding:4px 10px;border-radius:8px;background:var(--surface2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.dots button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.75rem;font-weight:650}
.dots button.ans{background:var(--acc-soft);border-color:var(--acc)}
.dots button.cur{outline:2px solid var(--acc);outline-offset:1px}

/* traps */
.traps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.trapc{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.trapc .f{padding:10px 14px;background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:.92rem}
.trapc .f::before{content:"✗ ";font-weight:800}
.trapc .v{padding:10px 14px;font-size:.93rem}
.trapc .v::before{content:"✓ ";color:var(--ok);font-weight:800}
.trapc .s{padding:0 14px 10px}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media (max-width:560px){
  main{padding:16px 16px 70px}
  .card{padding:16px}
  .fc{height:380px}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <a class="brand" href="#home" aria-label="Accueil">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" fill="var(--acc)"/><polygon points="15,6 24,15 15,24 6,15" fill="none" stroke="#fff" stroke-width="2"/><path d="M11.5 11.5 L18.5 18.5 M18.5 11.5 L11.5 18.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>BPMN · Révision</span>
    </a>
    <nav class="tabs" id="tabs">
      <a href="#home" data-v="home">Accueil</a>
      <a href="#cours" data-v="cours">Cours</a>
      <a href="#memento" data-v="memento">Memento</a>
      <a href="#cartes" data-v="cartes">Flashcards</a>
      <a href="#quiz" data-v="quiz">Quiz</a>
      <a href="#pieges" data-v="pieges">Pièges</a>
      <a href="#examen" data-v="examen">Examen blanc</a>
    </nav>
    <button class="iconbtn" id="themeBtn" title="Changer de thème" aria-label="Changer de thème">◐</button>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================
   Utilitaires
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('bpmn_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('bpmn_' + k, JSON.stringify(v)); } catch (e) { } }
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1800); }

/* =========================================================
   Moteur de dessin BPMN (SVG)
   ========================================================= */
function T(x, y, s, o = {}) {
  const fs = o.fs || 10.5, lh = fs * 1.18, lines = String(s).split('\n');
  let y0 = y - (lines.length - 1) * lh / 2;
  if (o.top) y0 = y + fs * 0.1;
  if (o.bottom) y0 = y - (lines.length - 1) * lh;
  const tr = o.rot ? ` transform="rotate(${o.rot} ${x} ${y})"` : '';
  return `<text x="${x}" y="${y0}" font-size="${fs}" text-anchor="${o.a || 'middle'}" class="tx${o.c ? ' ' + o.c : ''}"${tr}>` +
    lines.map((l, i) => `<tspan x="${x}"${i ? ` dy="${lh}"` : ''}>${esc(l)}</tspan>`).join('') + '</text>';
}
function N(x, y, hw, hh, s) { return { x, y, l: x - hw, r: x + hw, t: y - hh, b: y + hh, s, toString() { return this.s; } }; }
function G(x, y, sc, inner) { return `<g transform="translate(${x} ${y}) scale(${sc})">${inner}</g>`; }
function SV(w, h, body, alt) { return `<svg class="bp" viewBox="0 0 ${w} ${h}" width="${Math.round(w * 1.2)}" height="${Math.round(h * 1.2)}" role="img" aria-label="${esc(alt || 'Schéma BPMN')}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`; }
function pent(r) { let p = []; for (let k = 0; k < 5; k++) { const a = (-90 + 72 * k) * Math.PI / 180; p.push((r * Math.cos(a)).toFixed(2) + ',' + (r * Math.sin(a)).toFixed(2)); } return p.join(' '); }
function gear() {
  const p = [];
  for (let t = 0; t < 8; t++) {
    const a = t * 45;
    [[a - 15, 5.8], [a - 8, 8.8], [a + 8, 8.8], [a + 15, 5.8]].forEach(([d, r]) => { const rad = d * Math.PI / 180; p.push((r * Math.cos(rad)).toFixed(2) + ',' + (r * Math.sin(rad)).toFixed(2)); });

const CHAPTERS = [
  { id: 'intro', n: '0', t: 'Processus & BPM', html: () => `
<h2>Processus, BPM et pourquoi BPMN</h2>
<section>
<h3>Qu’est-ce qu’un processus ?</h3>
<p>Un <b>processus</b> est une <b>succession d’activités</b> qui <b>transforment des ressources</b> et <b>créent une valeur</b> pouvant satisfaire un <b>client</b>.</p>
<div class="grid g2">
  <div class="card"><b>Client externe</b> à l’organisation<br>→ processus <b>principal</b>, <b>opérationnel</b> ou <b>métier</b><p class="muted small">Ex. : servir un client au restaurant, vendre, produire.</p></div>
  <div class="card"><b>Client interne</b><br>→ processus de <b>support</b> ou de <b>soutien</b><p class="muted small">Ex. : paie, maintenance informatique, recrutement.</p></div>
</div>
<ul>
<li>Le processus est généralement <b>transversal</b> : il <b>traverse l’entreprise</b> (plusieurs services).</li>
<li>Il peut parfois être <b>décomposé en sous-processus</b>.</li>
<li>L’activité d’une organisation peut être <b>décrite par ses processus</b>.</li>
</ul>
</section>
<section>
<h3>La gestion par processus (BPM – Business Process Management)</h3>
<p>Le BPM permet de :</p>
<ol>
<li><b>Gérer l’entreprise de façon transversale</b> : « casser le cloisonnement », permettre le <b>workflow</b> (dans l’ERP par exemple).</li>
<li><b>Adopter un langage commun à tous les métiers</b> → communication managériale plus efficace (entre services, nouveaux arrivants…) mais aussi avec les partenaires, sous-traitants, clients.</li>
<li><b>Standardiser les processus</b> pour vérifier les <b>écarts entre le modèle optimal cible et l’existant</b> (optimiser, favoriser la qualité, respecter les normes, diminuer les risques).</li>
</ol>
${tip('<b>T-L-S</b> : <b>T</b>ransversal · <b>L</b>angage commun · <b>S</b>tandardiser.')}
</section>
<section>
<h3>Analyse et modélisation</h3>
<ul>
<li>L’analyse est formalisée par la <b>modélisation des processus</b> et la <b>rédaction de procédures</b>.</li>
<li>La <b>modélisation</b> est une <b>représentation schématique des flux et des traitements de l’information par et entre les acteurs</b> du système.</li>
<li>On parle de <b>modélisation</b> ou de <b>cartographie des processus</b>.</li>
</ul>
<h3>Comment modéliser ?</h3>
<ul>
<li>Avant tout un <b>travail d’investigation</b>, d’<b>échange avec chaque acteur</b>.</li>
<li>Par des techniques de <b>re-engineering</b> : lister les <b>flux d’information</b>, les <b>circuits de prise de décision</b>, les <b>processus opérationnels</b>.</li>
<li>Ce qui revient à <b>décortiquer le fonctionnement de l’organisation</b> pour comprendre ses processus métiers.</li>
</ul>
<h3>Pourquoi BPMN ?</h3>
<p><b>BPMN = Business Process Model and Notation.</b></p>
<ul>
<li>Parce qu’il est <b>normalisé par l’OMG</b> (Object Management Group). Normaliser = définir un <b>formalisme rigoureux</b> et des <b>règles de construction</b>.</li>
<li>L’OMG a diffusé en <b>2011</b> un document qui <b>standardise</b> la notation (BPMN 2.0).</li>
<li>Outils exploitant la norme : <b>Bizagi</b>, <b>Bonita</b> (Bonitasoft), <b>Heflo</b>.</li>
</ul>
${key('<b>Processus</b> = activités → ressources transformées → valeur pour un client. <b>Principal</b> (client externe) vs <b>support</b> (client interne). BPMN : norme <b>OMG</b>, <b>2011</b>.')}
</section>` },
  { id: 'base', n: '1', t: 'Activités, flux, événements', html: () => `
<h2>Les 3 briques de base</h2>
<section>
<h3>1. Activités</h3>
${fig(D.act())}
<p>Une activité est <b>une action</b>, une <b>unité de travail</b> réalisée au cours d’un processus, avec <b>un début et une fin bien identifiés</b>.</p>
<ul>
<li><b>Sous-processus</b> : peut être <b>re-décomposé</b> en plusieurs activités ou tâches.</li>
<li><b>Tâche</b> : <b>ne peut pas être décomposée</b>. Réalisée par une personne, une machine, une application ou une interaction entre eux.</li>
</ul>
${key('Le libellé d’une <b>tâche</b> est un <b>VERBE</b> d’action : « Saisir commande », « Préparer commande ».')}
</section>
<section>
<h3>2. Flux de séquence</h3>
${fig(D.flux())}
<p>Il décrit la logique du processus en <b>définissant le séquençage (l’orchestration)</b> des activités les unes par rapport aux autres. <b>Chaque flux a une origine et une destination.</b></p>
${fig(D.chain4(), 'Orchestration des activités : service au restaurant')}
</section>
<section>
<h3>3. Événements standards</h3>
<p>Ils décrivent ce qui va <b>déclencher</b>, <b>interrompre</b> ou <b>influencer</b> le déroulement du processus (proche des événements des <b>MCT</b>).</p>
<div class="tw"><table class="t">
<tr><th>Symbole</th><th>Événement</th><th>Règle</th></tr>
<tr><td>${sym.ev({ k: 'start' })}</td><td><b>Départ</b> (cercle fin)</td><td><b>Obligatoire et unique</b> dans chaque processus</td></tr>
<tr><td>${sym.ev({ k: 'end' })}</td><td><b>Fin</b> (cercle épais)</td><td><b>Obligatoire</b>, peut être <b>multiple</b></td></tr>
<tr><td>${sym.ev({ k: 'inter' })}</td><td><b>Intermédiaire</b> (double cercle)</td><td><b>Optionnel</b>. Le processus peut en être <b>émetteur</b> ou <b>destinataire</b> → permet d’<b>interagir avec d’autres processus</b></td></tr>
</table></div>
${fig(D.std())}
<ul>
<li>Toute modélisation <b>commence par un événement de départ</b> et <b>se termine par (au moins) un événement de fin</b>.</li>
<li>Événements et activités sont <b>ordonnancés par les flux</b> d’orchestration.</li>
<li>Le <b>nom de l’événement</b> est indiqué <b>en dessous du cercle</b>.</li>
</ul>
<h3>Exemple complet</h3>
${fig(D.resto(), 'Déclenché par la demande du client, terminé par son départ. L’événement intermédiaire « demande de la note » s’insère entre le service et l’encaissement. L’annotation (crochet) ajoute un commentaire.')}
${trap('Un processus = <b>UN seul</b> départ. Plusieurs fins sont possibles. Aucun intermédiaire n’est obligatoire.')}
</section>` },
  { id: 'pass', n: '2', t: 'Passerelles', html: () => `
<h2>4. Les passerelles (gateways)</h2>
<p>Une passerelle <b>contrôle le flux de séquence</b> en <b>proposant différents chemins</b> (divergence) <b>ou</b> en <b>regroupant plusieurs chemins</b> (convergence) — <b>mais pas les deux en même temps !</b></p>
<div class="symrow">
${symCard(sym.gw('x'), 'Exclusive', 'X ou vide · 1 seul chemin')}
${symCard(sym.gw(''), 'Exclusive (vide)', 'même sens que X')}
${symCard(sym.gw('+'), 'Parallèle', '+ · tous les chemins')}
${symCard(sym.gw('o'), 'Inclusive', '○ · un, certains ou tous')}
</div>
<section>
<h3>4.1 Passerelle exclusive</h3>
<ul>
<li>Elle permet de <b>créer des alternatives</b>. C’est la <b>passerelle par défaut</b>.</li>
<li>Se représente <b>soit vide, soit avec une croix X</b> (<b>X et non + !!!</b>).</li>
</ul>
<h4>Diviser le flux en chemins exclusifs</h4>
<p>On divise le flux en plusieurs chemins <b>exclusifs</b> en fonction d’une <b>condition basée sur une information</b> → <b>un seul chemin choisi</b>.</p>
${fig(D.exGen())}
${fig(D.exclQ(), '<b>Question sous la passerelle</b>, <b>choix sur les flux</b> (Oui / Non).')}
<h4>Reconstituer un chemin unique</h4>
${fig(D.mergeGen(), 'Convergence : la passerelle exclusive regroupe les chemins exclusifs.')}
${fig(D.excl(false), 'Exemple complet : divergence puis convergence exclusives.')}
<h4>Simplification autorisée en reconstitution (seulement pour l’exclusive !)</h4>
${fig(D.excl(true), 'La passerelle de convergence peut être omise : les flux arrivent directement sur « Encaisser ».')}
<h4>Multiplicité des choix et chemin par défaut</h4>
<p>On peut avoir plus de 2 choix. Le <b>chemin par défaut</b> (petit trait oblique à l’origine du flux) est pris <b>si aucune autre condition n’est vérifiée</b>.</p>
${fig(D.multiGen())}
${fig(D.pay(), 'Si le mode de paiement n’est ni espèces, ni CB, ni chèque, le chemin par défaut renvoie vers la demande.')}
</section>
<section>
<h3>4.2 Passerelle parallèle</h3>
<ul>
<li>Elle modélise des <b>flux en parallèle</b> : le flux <b>continue sur l’ensemble des chemins</b>.</li>
<li>Elle permet de <b>synchroniser</b> plusieurs chemins : la séquence <b>ne continuera qu’une fois l’ensemble des flux parallèles terminés</b>.</li>
</ul>
${fig(D.menu('+', false), 'Menu complet : frites, burger ET boisson sont toujours préparés.')}
<h4>Simplification autorisée en entrée (seulement pour la parallèle !)</h4>
${fig(D.menu('+', true), 'La passerelle de divergence peut être omise : plusieurs flux sortent directement de l’activité. La passerelle de synchronisation reste.')}
</section>
<section>
<h3>4.3 Passerelle inclusive</h3>
<ul>
<li>Elle est <b>conditionnelle</b> (comme l’exclusive)…</li>
<li>… mais le flux peut progresser sur <b>plusieurs chemins</b> si ceux-ci vérifient la condition.</li>
<li>L’éclatement pourra se faire sur <b>une, certaines ou toutes</b> les branches.</li>
</ul>
${fig(D.menu('o', false), 'Menu (complet ou pas) : selon le contenu de la commande.')}
</section>
<h3>Tableau comparatif</h3>
<div class="tw"><table class="t">
<tr><th>Passerelle</th><th>Symbole</th><th>Divergence</th><th>Convergence</th><th>Simplification</th></tr>
<tr><td><b>Exclusive</b></td><td>${sym.gw('x')}</td><td>1 seul chemin (condition)</td><td>laisse passer le 1er flux arrivé</td><td>en <b>reconstitution</b> (sortie)</td></tr>
<tr><td><b>Parallèle</b></td><td>${sym.gw('+')}</td><td>tous les chemins</td><td><b>attend tous</b> les flux (synchro)</td><td>en <b>entrée</b> (divergence)</td></tr>
<tr><td><b>Inclusive</b></td><td>${sym.gw('o')}</td><td>1, certains ou tous (conditions)</td><td>attend les flux activés</td><td>aucune</td></tr>
</table></div>
${trap('« Le client a-t-il une carte ? » → <b>question</b> = <b>exclusive</b> (X). Le <b>+</b> est réservé au parallèle, il n’y a <b>jamais de condition</b> sur un +.')}
${tip('<b>X</b> = « <b>OU</b> exclusif » (l’un ou l’autre) · <b>+</b> = « <b>ET</b> » (tout) · <b>○</b> = « <b>ET/OU</b> » (un ou plusieurs).')}` },
  { id: 'collab', n: '3', t: 'Piscines & couloirs', html: () => `
<h2>5. La collaboration</h2>
<div class="grid g2">
<div class="card"><b>Buts</b><ul><li>Identifier le processus (pour les échanges par exemple)</li><li>Connaître les acteurs réalisant les différentes tâches</li></ul></div>

<section>
<h3>5.1 Piscine</h3>

${fig(D.pool1(), 'La piscine « Service au client » contient le processus ; la piscine « Client » (entité/rôle) peut rester vide.')}
</section>
<section>
<h3>5.2 Couloir</h3>
<p>C’est une <b>subdivision de la piscine</b> pour présenter les <b>participants internes</b> :</p>
<ul><li>les <b>rôles d’acteur</b></li><li>les <b>services</b></li><li>une <b>application informatique</b>…</li><li><b>mais jamais une personne !</b></li></ul>

<h4>Subdivision de couloir</h4>
${fig(D.pool3(), 'Le couloir « Salle » est lui-même subdivisé en « Serveur » et « Responsable ».')}
</section>
<section>
<h3>Lisibilité</h3>
<p>Votre processus doit être <b>clair</b> et <b>compréhensible par n’importe qui</b> :</p>
<ul>
<li>Déroulé de la <b>gauche vers la droite</b></li>
<li>Chemin « <b>idéal</b> » le <b>plus centré</b> possible</li>

<p>C’est un <b>compromis</b> (parfois difficile) entre trop et pas assez d’informations.</p>

</section>` },
  { id: 'nat', n: '4', t: 'Natures d’événements', html: () => `
<h2>6. Différentes natures d’événements</h2>
<ul>
<li>On peut <b>ajouter des pictogrammes</b> aux événements pour préciser leur <b>nature</b>. Ils s’inscrivent <b>à l’intérieur du cercle</b>.</li>

<h4>Timer (toujours catch)</h4>
<p>Il modélise un <b>délai d’attente</b> ou une <b>échéance</b> entre deux activités.</p>

function allCards() {
  const s = [];
  Object.values(SYMS).flat().forEach(x => s.push({ id: x.id, type: 'sym', front: `${x.svg()}<div class="q" style="margin-top:12px">Quel est ce symbole ?</div>`, name: x.n, desc: x.d }));
  EV_CELLS.filter(c => [0, 2, 3, 5].includes(c.col)).forEach(c => s.push({ id: c.id, type: 'sym', front: `${c.svg()}<div class="q" style="margin-top:12px">Quel est cet événement ?</div>`, name: c.n, desc: c.d }));
  DEFS.forEach(([qq, a], i) => s.push({ id: 'def-' + i, type: 'def', front: `<div class="q">${esc(qq)}</div>`, name: 'Réponse', desc: esc(a) }));
  return s;
}

function viewCartes() {
  const cards = allCards();
  let filter = store.get('cardFilter', 'todo');
  let deck = [], pos = 0, flipped = false, sessionOk = 0;
  const build = () => {
    const kn = known();
    deck = shuffle(cards.filter(c => filter === 'all' ? true : filter === 'sym' ? c.type === 'sym' : filter === 'def' ? c.type === 'def' : !kn[c.id]));
    pos = 0; flipped = false; sessionOk = 0;
  };
  const render = () => {
    const kn = known(), nK = cards.filter(c => kn[c.id]).length;
    const c = deck[pos];
    app.innerHTML = `<div class="fc-wrap">
<div class="row" style="justify-content:space-between"><h2 style="margin:0">Flashcards</h2>
<select id="ff"><option value="todo">Non maîtrisées</option><option value="all">Toutes</option><option value="sym">Symboles</option><option value="def">Notions</option></select></div>
<div class="row small muted" style="justify-content:space-between;margin-top:8px"><span>${deck.length ? `Carte ${Math.min(pos + 1, deck.length)} / ${deck.length}` : ''}</span><span>${nK} / ${cards.length} maîtrisées</span></div>
<div class="bar" style="margin-top:6px"><i style="width:${deck.length ? pos / deck.length * 100 : 100}%"></i></div>
${c ? `<div class="fc ${flipped ? 'flip' : ''}" id="fc" tabindex="0" role="button" aria-label="Retourner la carte">
  <div class="fc-in"><div class="fc-f">${c.front}<span class="hint">Clique ou <kbd>Espace</kbd> pour retourner</span></div>
  <div class="fc-b"><div class="a">${esc(c.name)}</div><div class="d">${c.desc}</div></div></div></div>
<div class="row" style="justify-content:center"><button class="btn" id="bad">← À revoir</button><button class="btn pri" id="ok">Je savais →</button></div>
<p class="muted small" style="text-align:center;margin-top:10px">Raccourcis : <kbd>Espace</kbd> retourner · <kbd>←</kbd> à revoir · <kbd>→</kbd> je savais</p>`
        : `<div class="card" style="text-align:center;margin-top:16px"><div class="score">🎉</div><h3>${filter === 'todo' ? 'Toutes les cartes sont maîtrisées !' : 'Paquet terminé'}</h3><p class="muted">${sessionOk} carte(s) validée(s) pendant cette série.</p><div class="row" style="justify-content:center"><button class="btn pri" id="again">Recommencer</button><a class="btn" href="#quiz">Passer au quiz</a></div></div>`}
</div>`;
    $('#ff').value = filter;
    $('#ff').onchange = e => { filter = e.target.value; store.set('cardFilter', filter); build(); render(); };
    if (c) {
      $('#fc').onclick = () => { flipped = !flipped; $('#fc').classList.toggle('flip', flipped); };
      $('#ok').onclick = () => answer(true);
      $('#bad').onclick = () => answer(false);
    } else $('#again').onclick = () => { if (filter === 'todo' && !cards.some(x => !known()[x.id])) { filter = 'all'; store.set('cardFilter', filter); } build(); render(); };
  };
  const answer = ok => {
    const c = deck[pos]; if (!c) return;
    const kn = known();
    if (ok) { kn[c.id] = 1; sessionOk++; pos++; }
    else { delete kn[c.id]; deck.push(deck.splice(pos, 1)[0]); if (deck.length === 1) pos = 0; }
    store.set('known', kn); flipped = false; render();
  };
  const onKey = e => {
    if (e.target.tagName === 'SELECT') return;
    if (e.key === ' ' || e.key === 'Enter') { const f = $('#fc'); if (f) { e.preventDefault(); f.click(); } }
    if (e.key === 'ArrowRight') { if ($('#ok')) answer(true); }
    if (e.key === 'ArrowLeft') { if ($('#bad')) answer(false); }
  };
  document.addEventListener('keydown', onKey);
  cleanup = () => document.removeEventListener('keydown', onKey);
  build(); render();
}

/* -------- Quiz -------- */
function prepQ(item) {
  const opts = shuffle(item.opts.map((t, i) => ({ t, ok: i === 0 })));
  return Object.assign({}, item, { shown: opts });
}
function viewQuiz(arg) {
  if (!arg) return quizSetup();
  let pool;
  if (arg === 'erreurs') { const w = wrongSet(); pool = QB.filter(x => w[x.id]); }
  else if (arg === 'tout') pool = QB.slice();
  else pool = QB.filter(x => x.ch === arg);
  if (!pool.length) { app.innerHTML = `<div class="qwrap card"><h2>Rien à réviser ici</h2><p class="muted">${arg === 'erreurs' ? 'Aucune erreur enregistrée. Bravo !' : 'Thème introuvable.'}</p><a class="btn pri" href="#quiz">Retour</a></div>`; return; }
  const n = Math.min(parseInt(store.get('quizN', 15), 10) || 15, pool.length);
  runQuiz(shuffle(pool).slice(0, arg === 'erreurs' ? pool.length : n).map(prepQ), arg);
}
function quizSetup() {
  const b = best(), w = Object.keys(wrongSet()).length;
  const nSel = store.get('quizN', 15);
  app.innerHTML = `<div class="qwrap">
<h2>Quiz</h2><p class="muted">Correction immédiate avec explication. Raccourcis : <kbd>1</kbd>–<kbd>4</kbd> pour répondre, <kbd>Entrée</kbd> pour continuer.</p>
<div class="row" style="margin:10px 0 16px"><label class="small muted" for="qn">Questions par série</label><select id="qn"><option>10</option><option>15</option><option>20</option><option value="999">Toutes</option></select></div>
<div class="grid g2">
${Object.entries(CH_LABEL).map(([k, l]) => `<a class="card" href="#quiz/${k}" style="text-decoration:none;color:inherit;padding:14px"><div class="row" style="justify-content:space-between"><b>${l}</b><span class="pill ${b[k] >= 80 ? 'ok' : b[k] != null ? 'bad' : ''}">${b[k] != null ? 'meilleur : ' + b[k] + ' %' : QB.filter(x => x.ch === k).length + ' q.'}</span></div></a>`).join('')}
<a class="card" href="#quiz/tout" style="text-decoration:none;color:inherit;padding:14px;border-color:var(--acc)"><div class="row" style="justify-content:space-between"><b>Tout mélangé</b><span class="pill acc">${QB.length} q.</span></div></a>
${w ? `<a class="card" href="#quiz/erreurs" style="text-decoration:none;color:inherit;padding:14px;border-color:var(--bad)"><div class="row" style="justify-content:space-between"><b>Mes erreurs</b><span class="pill bad">${w} q.</span></div></a>` : ''}
</div></div>`;
  $('#qn').value = String(nSel);
  $('#qn').onchange = e => store.set('quizN', parseInt(e.target.value, 10));
}
function runQuiz(qs, key) {
  let i = 0, score = 0, answered = false;
  const log = [];
  const render = () => {
    const x = qs[i];
    app.innerHTML = `<div class="qwrap">
<div class="qhead"><span class="pill acc">${CH_LABEL[x.ch]}</span><span class="muted small">Question ${i + 1} / ${qs.length} · score ${score}</span></div>
<div class="bar"><i style="width:${i / qs.length * 100}%"></i></div>
<div class="card" style="margin-top:14px">
${x.img ? `<div class="qimg">${x.img()}</div>` : ''}
<div class="qtxt">${esc(x.text)}</div>
<div class="opts">${x.shown.map((o, k) => `<button class="opt" data-k="${k}"><span class="l">${k + 1}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
<div id="fb"></div>
</div></div>`;
    answered = false;
    $$('.opt').forEach(b => b.onclick = () => pick(+b.dataset.k));
  };
  const pick = k => {
    if (answered) return; answered = true;
    const x = qs[i], ok = x.shown[k].ok;
    if (ok) score++;
    log.push({ x, k, ok });
    const w = wrongSet(); if (ok) delete w[x.id]; else w[x.id] = 1; store.set('wrong', w);
    $$('.opt').forEach((b, j) => { b.disabled = true; if (x.shown[j].ok) b.classList.add('good'); else if (j === k) b.classList.add('wrong'); });
    $('#fb').innerHTML = `<div class="exp"><b style="color:${ok ? 'var(--ok)' : 'var(--bad)'}">${ok ? 'Bonne réponse' : 'Raté'}.</b> ${esc(x.exp)}</div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" id="nx">${i < qs.length - 1 ? 'Suivant →' : 'Voir le résultat'}</button></div>`;
    $('#nx').onclick = next; $('#nx').focus();
  };
  const next = () => { i++; if (i < qs.length) render(); else finish(); };
  const finish = () => {
    const pct = Math.round(score / qs.length * 100);
    if (CH_LABEL[key]) { const b = best(); b[key] = Math.max(b[key] || 0, pct); store.set('best', b); }
    const ko = log.filter(l => !l.ok);
    app.innerHTML = `<div class="qwrap"><div class="card" style="text-align:center">
<div class="score">${pct} %</div><p class="muted">${score} / ${qs.length} bonnes réponses${CH_LABEL[key] ? ' · ' + CH_LABEL[key] : ''}</p>
<p>${pct >= 90 ? 'Excellent, c’est maîtrisé.' : pct >= 70 ? 'Solide. Relis les explications des erreurs ci-dessous.' : 'À retravailler : relis le chapitre puis refais la série.'}</p>
<div class="row" style="justify-content:center">${ko.length ? `<button class="btn pri" id="redo">Refaire mes ${ko.length} erreur(s)</button>` : ''}<button class="btn" id="again">Nouvelle série</button><a class="btn ghost" href="#quiz">Autres thèmes</a></div></div>
${ko.length ? `<h3>Corrections</h3><div class="review">${ko.map(l => `<div class="it ko">${l.x.img ? `<div class="qimg">${l.x.img()}</div>` : ''}<b>${esc(l.x.text)}</b><div class="small" style="margin-top:6px">Ta réponse : <span style="color:var(--bad)">${esc(l.x.shown[l.k].t)}</span><br>Bonne réponse : <span style="color:var(--ok);font-weight:650">${esc(l.x.opts[0])}</span></div><div class="small muted" style="margin-top:6px">${esc(l.x.exp)}</div></div>`).join('')}</div>` : ''}</div>`;
    if (ko.length) $('#redo').onclick = () => runQuiz(ko.map(l => prepQ(l.x)), key);
    $('#again').onclick = () => viewQuiz(key);
  };
  const onKey = e => {
    if (/^[1-4]$/.test(e.key) && !answered) { const k = +e.key - 1; if (qs[i] && k < qs[i].shown.length) pick(k); }
    else if (e.key === 'Enter' && answered && $('#nx') && document.activeElement !== $('#nx')) { e.preventDefault(); next(); }
  };
  document.addEventListener('keydown', onKey);
  cleanup = () => document.removeEventListener('keydown', onKey);
  render();
}

function viewExamen() {
  const b = best();
  app.innerHTML = `<div class="qwrap"><div class="card">
<h2>Examen blanc</h2>
<p><b>25 questions</b> tirées au hasard dans tout le cours (dont des schémas à analyser), <b>25 minutes</b>. Pas de correction pendant l’épreuve : tu peux naviguer entre les questions et changer tes réponses. Note sur 20 à la fin, avec corrigé détaillé.</p>
<p class="muted small">Répartition : ~20 % symboles, ~25 % règles, ~25 % mises en situation, ~20 % schémas « trouve l’erreur ».</p>
${b.exam != null ? `<p>Meilleure note : <b>${b.exam.toFixed(1).replace('.', ',')} / 20</b></p>` : ''}
<button class="btn pri" id="go">Lancer l’examen</button></div></div>`;
  $('#go').onclick = startExam;
}
function startExam() {
  const pick = (ch, n) => shuffle(QB.filter(x => ch.includes(x.ch))).slice(0, n);
  const qs = shuffle([
    ...pick(['diag'], 5), ...pick(['cas'], 6), ...pick(['pass'], 3), ...pick(['nat'], 4),
    ...pick(['adv'], 3), ...pick(['base', 'collab'], 3), ...pick(['intro', 'memo'], 1)
  ]).map(prepQ);
  const ans = new Array(qs.length).fill(null);
  let i = 0, end = Date.now() + 25 * 60 * 1000, done = false;
  const tick = () => {
    const left = Math.max(0, end - Date.now()), t = $('#tm');
    if (t) { const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000); t.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; t.classList.toggle('low', left < 3 * 60000); }
    if (left <= 0 && !done) { toast('Temps écoulé !'); finish(); }
  };
  const iv = setInterval(tick, 500);
  cleanup = () => { clearInterval(iv); document.removeEventListener('keydown', onKey); };
  const render = () => {
    const x = qs[i];
    app.innerHTML = `<div class="qwrap">
<div class="qhead"><b>Examen blanc</b><span class="timer" id="tm">25:00</span></div>
<div class="dots">${qs.map((_, k) => `<button class="${ans[k] != null ? 'ans' : ''} ${k === i ? 'cur' : ''}" data-k="${k}">${k + 1}</button>`).join('')}</div>
<div class="card">
<div class="muted small">Question ${i + 1} / ${qs.length}</div>
${x.img ? `<div class="qimg" style="margin-top:8px">${x.img()}</div>` : ''}
<div class="qtxt">${esc(x.text)}</div>
<div class="opts">${x.shown.map((o, k) => `<button class="opt ${ans[i] === k ? 'sel' : ''}" data-k="${k}"><span class="l">${k + 1}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
<div class="row" style="justify-content:space-between;margin-top:16px">
<button class="btn ghost" id="pv" ${i === 0 ? 'disabled' : ''}>← Précédente</button>
${i < qs.length - 1 ? '<button class="btn" id="nx">Suivante →</button>' : ''}
</div></div>
<div class="row" style="justify-content:flex-end;margin-top:14px"><span class="muted small">${ans.filter(a => a != null).length} / ${qs.length} répondues</span><button class="btn pri" id="sub">Rendre la copie</button></div></div>`;
    tick();
    $$('.opt').forEach(b => b.onclick = () => { ans[i] = +b.dataset.k; if (i < qs.length - 1) { i++; } render(); });
    $$('.dots button').forEach(b => b.onclick = () => { i = +b.dataset.k; render(); });
    $('#pv').onclick = () => { if (i > 0) { i--; render(); } };
    if ($('#nx')) $('#nx').onclick = () => { i++; render(); };
    $('#sub').onclick = () => { const miss = ans.filter(a => a == null).length; if (!miss || confirm(`${miss} question(s) sans réponse. Rendre quand même ?`)) finish(); };
  };
  const finish = () => {
    if (done) return; done = true; clearInterval(iv); document.removeEventListener('keydown', onKey);
    let sc = 0; const w = wrongSet();
    qs.forEach((x, k) => { const ok = ans[k] != null && x.shown[ans[k]].ok; if (ok) { sc++; delete w[x.id]; } else w[x.id] = 1; });
    store.set('wrong', w);
    const note = Math.round(sc / qs.length * 200) / 10;
    const b = best(); b.exam = Math.max(b.exam != null ? b.exam : 0, note); store.set('best', b);
    app.innerHTML = `<div class="qwrap"><div class="card" style="text-align:center">
<div class="score">${note.toFixed(1).replace('.', ',')} / 20</div><p class="muted">${sc} / ${qs.length} bonnes réponses</p>
<p>${note >= 16 ? 'Très bien : tu es prêt·e pour demain.' : note >= 12 ? 'Correct. Retravaille les erreurs ci-dessous puis refais un examen.' : 'Revois les chapitres concernés et la page « Pièges », puis retente.'}</p>
<div class="row" style="justify-content:center"><button class="btn pri" id="re">Nouvel examen</button><a class="btn" href="#quiz/erreurs">Refaire mes erreurs</a></div></div>
<h3>Corrigé</h3><div class="review">${qs.map((x, k) => { const ok = ans[k] != null && x.shown[ans[k]].ok; return `<div class="it ${ok ? 'okk' : 'ko'}"><div class="row" style="justify-content:space-between"><span class="pill">${k + 1} · ${CH_LABEL[x.ch]}</span><span class="pill ${ok ? 'ok' : 'bad'}">${ok ? 'juste' : ans[k] == null ? 'sans réponse' : 'faux'}</span></div>${x.img && !ok ? `<div class="qimg" style="margin-top:8px">${x.img()}</div>` : ''}<b style="display:block;margin-top:8px">${esc(x.text)}</b>${!ok ? `<div class="small" style="margin-top:6px">${ans[k] != null ? `Ta réponse : <span style="color:var(--bad)">${esc(x.shown[ans[k]].t)}</span><br>` : ''}Bonne réponse : <span style="color:var(--ok);font-weight:650">${esc(x.opts[0])}</span></div><div class="small muted" style="margin-top:6px">${esc(x.exp)}</div>` : ''}</div>`; }).join('')}</div></div>`;
    $('#re').onclick = startExam;
    window.scrollTo(0, 0);
  };
  const onKey = e => {
    if (/^[1-4]$/.test(e.key) && !done) { const k = +e.key - 1; if (k < qs[i].shown.length) { ans[i] = k; if (i < qs.length - 1) i++; render(); } }
    if (e.key === 'ArrowRight' && i < qs.length - 1 && !done) { i++; render(); }
    if (e.key === 'ArrowLeft' && i > 0 && !done) { i--; render(); }
  };
  document.addEventListener('keydown', onKey);
  render();
}

function viewPieges() {
  store.set('trapsSeen', true);
  app.innerHTML = `<h2>Pièges d’examen & règles d’or</h2>
<p class="muted">Les ${TRAPS.length} erreurs les plus fréquentes, et la règle à appliquer. À relire juste avant l’épreuve.</p>
<div class="traps">${TRAPS.map(([f, v, s]) => `<div class="trapc"><div class="f">${esc(f)}</div><div class="v">${esc(v)}</div>${s ? `<div class="s row">${s()}</div>` : ''}</div>`).join('')}</div>
<div class="card" style="margin-top:18px"><h3 style="margin-top:0">Checklist avant de rendre un schéma</h3>
<ul>
<li>☐ Un seul événement de départ, au moins une fin, noms sous les cercles</li>
<li>☐ Tâches = verbes, sous-processus = noms</li>
<li>☐ Chaque passerelle : diverge <i>ou</i> converge ; question dessous, choix sur les flux</li>
<li>☐ Parallèle → reconvergence parallèle ; simplifications uniquement autorisées (exclusive en sortie, parallèle en entrée)</li>
<li>☐ Départs blancs (catch), fins noires (throw), timers catch ; point de vue = processus étudié</li>
<li>☐ Couloirs = rôles/services (jamais une personne), chaque activité dans un seul couloir</li>
<li>☐ Sous-processus : flux à la bordure, départ sans pictogramme, une fin</li>
<li>☐ Lisibilité : gauche → droite, chemin idéal centré, peu de croisements</li>
</ul></div>
<div class="row" style="justify-content:center;margin-top:18px"><a class="btn pri" href="#examen">Passer l’examen blanc →</a></div>`;
}

/* =========================================================
   Routeur & thème
   ========================================================= */
const VIEWS = { home: viewHome, cours: viewCours, memento: viewMemento, cartes: viewCartes, quiz: viewQuiz, pieges: viewPieges, examen: viewExamen };
function route() {
  if (cleanup) { cleanup(); cleanup = null; }
  const [v, arg] = (location.hash.slice(1) || 'home').split('/');
  const fn = VIEWS[v] || viewHome;
  fn(arg ? decodeURIComponent(arg) : undefined);
  $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.v === (VIEWS[v] ? v : 'home')));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
(function theme() {
  const saved = store.get('theme', null);
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  $('#themeBtn').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nx); store.set('theme', nx);
  };
})();
route();
</script>
</body>
</html>
