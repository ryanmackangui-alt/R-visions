<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision Propriété intellectuelle</title>
<meta name="description" content="Application de révision du cours de droit de la propriété intellectuelle (R5.02, A. Mbotaingar) : cours complété et vérifié, mémento des articles, flashcards, QCM difficiles, cas pratiques et examen blanc.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0;--surface:#ffffff;--surface2:#efede7;--ink:#1c1a17;--muted:#6a655c;--line:#e0dcd2;
  --acc:#7b1f79;--acc-soft:#f4e6f3;--acc2:#0e7f92;--acc2-soft:#e2f4f6;
  --ok:#1d7f46;--ok-soft:#e3f3e8;--bad:#bf3228;--bad-soft:#fbe7e4;--warn:#96600f;--warn-soft:#fbf0dc;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --r:14px;--serif:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141317;--surface:#1d1c21;--surface2:#26252c;--ink:#ecebe7;--muted:#a19d95;--line:#34323a;
    --acc:#e08fdd;--acc-soft:#3a2439;--acc2:#4ccadd;--acc2-soft:#193338;
    --ok:#5cc98a;--ok-soft:#1b3326;--bad:#f07a70;--bad-soft:#3b2120;--warn:#e6b25a;--warn-soft:#382d18;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#141317;--surface:#1d1c21;--surface2:#26252c;--ink:#ecebe7;--muted:#a19d95;--line:#34323a;
  --acc:#e08fdd;--acc-soft:#3a2439;--acc2:#4ccadd;--acc2-soft:#193338;
  --ok:#5cc98a;--ok-soft:#1b3326;--bad:#f07a70;--bad-soft:#3b2120;--warn:#e6b25a;--warn-soft:#382d18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
button,textarea,select,input{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:750;letter-spacing:-.01em}
h3{font-size:1.12rem;font-weight:700;margin-top:1.6em}
h4{margin:1.2em 0 .4em;font-size:1rem}
p{margin:.45em 0 .8em}
ul,ol{margin:.3em 0 .9em;padding-left:1.25em}
li{margin:.25em 0}
b,strong{font-weight:650}
.muted{color:var(--muted)}
.small{font-size:.86rem}
q,.cite{font-family:var(--serif);font-style:italic;font-size:1.03em}
q{quotes:"« " " »"}
.art{font-weight:700;color:var(--acc2);white-space:nowrap}

header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;text-decoration:none;color:var(--ink);white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
nav.tabs a:hover{background:var(--surface2);color:var(--ink)}
nav.tabs a.on{background:var(--acc);color:#fff}
:root[data-theme="dark"] nav.tabs a.on,:root[data-theme="dark"] .btn.pri{color:#1a0f1a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs a.on,:root:not([data-theme="light"]) .btn.pri{color:#1a0f1a}}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
@media (max-width:720px){.brand span{display:none}}

main{max-width:1180px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid>*,.course>*,.hero>*{min-width:0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:650;background:var(--surface2);color:var(--muted)}
.pill.acc{background:var(--acc-soft);color:var(--acc)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
select,input[type=search]{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
input[type=search]{width:100%;max-width:360px}

.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.bar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s;display:grid;gap:8px}
ol.steps li{counter-increment:s;display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin:0}
ol.steps li>div::before{content:counter(s);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface2);font-weight:700;font-size:.8rem;margin-right:10px}
ol.steps li.done>div::before{content:"✓";background:var(--ok);color:#fff}

.course{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}
@media (max-width:860px){.course{grid-template-columns:1fr}}
.toc{position:sticky;top:70px;display:grid;gap:4px}
@media (max-width:860px){.toc{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}}
.toc a{display:flex;gap:8px;align-items:baseline;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem}
@media (max-width:860px){.toc a{white-space:nowrap;border:1px solid var(--line);background:var(--surface)}}
.toc a:hover{background:var(--surface2);color:var(--ink)}
.toc a.on{background:var(--acc-soft);color:var(--acc)}
.toc a .n{font-variant-numeric:tabular-nums;opacity:.7}
.toc a.read .n::after{content:" ✓";color:var(--ok)}
article.ch{max-width:780px}
article.ch h2{margin-bottom:.2em}
article.ch h3{border-top:1px solid var(--line);padding-top:1.1em}
.box{border-radius:12px;padding:12px 15px;margin:14px 0;border:1px solid var(--line);background:var(--surface)}
.box .bt{display:block;font-size:.74rem;font-weight:750;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.box.key{background:var(--acc-soft);border-color:transparent}.box.key .bt{color:var(--acc)}
.box.trap{background:var(--bad-soft);border-color:transparent}.box.trap .bt{color:var(--bad)}
.box.tip{background:var(--acc2-soft);border-color:transparent}.box.tip .bt{color:var(--acc2)}
.box.fix{background:var(--warn-soft);border-color:transparent}.box.fix .bt{color:var(--warn)}
.box.plus{border-style:dashed}.box.plus .bt{color:var(--muted)}
.tw{overflow-x:auto;margin:12px 0}
table.t{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--surface);border-radius:12px;overflow:hidden}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--surface2);font-weight:700}

.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.exp{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-top:10px}
.qtext{font-size:1.08rem;font-weight:600;margin:10px 0 14px}

.flash{perspective:1200px;max-width:640px;margin:18px auto}
.flash .in{position:relative;min-height:260px;cursor:pointer}
.flash .f{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.flash .f.b{background:var(--acc-soft);border-color:transparent;text-align:left;align-items:stretch}
.flash .big{font-size:1.25rem;font-weight:700}

.case{margin-bottom:14px}
.case summary{cursor:pointer;font-weight:700;font-size:1.05rem}
.facts{font-family:var(--serif);font-size:1.04rem;background:var(--surface2);border-radius:12px;padding:12px 15px;margin:10px 0}
.chk{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.chk input{margin-top:5px;accent-color:var(--acc);width:16px;height:16px;flex:none}
details.ans{margin:8px 0 16px}
details.ans>summary{cursor:pointer;color:var(--acc);font-weight:650}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <a class="brand" href="#home" aria-label="Accueil">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" fill="var(--acc)"/><circle cx="15" cy="15" r="8" fill="none" stroke="#fff" stroke-width="2"/><path d="M18.2 12.3a4 4 0 1 0 0 5.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Propriété intellectuelle</span>
    </a>
    <nav class="tabs" id="tabs">
      <a href="#home" data-v="home">Accueil</a>
      <a href="#cours" data-v="cours">Cours</a>
      <a href="#fiche" data-v="fiche">Fiche express</a>
      <a href="#articles" data-v="articles">Articles &amp; arrêts</a>
      <a href="#cartes" data-v="cartes">Flashcards</a>
      <a href="#quiz" data-v="quiz">QCM</a>
      <a href="#cas" data-v="cas">Cas &amp; questions de cours</a>
      <a href="#pieges" data-v="pieges">Pièges</a>
      <a href="#examen" data-v="examen">Examen blanc</a>
    </nav>
    <button class="iconbtn" id="themeBtn" title="Changer de thème" aria-label="Changer de thème">◐</button>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
'use strict';
